name: Appliquer objectif final

on:
  push:
    paths:
      - '.github/workflows/run-ajout-objectif-final.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre a jour la page
        run: python .github/scripts/add_objective_final.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/capsules-approfondies.html
          git diff --cached --quiet || git commit -m "Rendre l objectif final visible et ajouter le constructeur de Lab"
          git push
