name: Ajouter videos francaises aux capsules

on:
  push:
    paths:
      - '.github/workflows/ajout-videos-fr.yml'
      - '.github/scripts/patch_videos.py'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le patch videos
        run: python3 .github/scripts/patch_videos.py
      - name: Enregistrer les modifications
        run: |
          git config user.name "jaycikomo"
          git config user.email "47773376+jaycikomo@users.noreply.github.com"
          git add lab/capsules-approfondies.html
          git diff --cached --quiet || git commit -m "Ajouter une video francaise dans chaque capsule"
          git push
