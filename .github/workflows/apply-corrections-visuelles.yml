name: Enrichir catalogue Docker VMware

on:
  push:
    paths:
      - '.github/workflows/apply-corrections-visuelles.yml'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter les capsules VMware et conversion VirtualBox
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lab/capsules-approfondies.html')
          s = p.read_text(encoding='utf-8')

          if "id:'W01'" not in s:
              marker = "{id:'P01',track:'Proxmox'"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('Point insertion Proxmox introuvable')
              vmware = [
                  r"{id:'W01',track:'VMware',lvl:1,title:'VMware Workstation : rôle, architecture et cas d’usage',know:['VMware Workstation est un hyperviseur de poste de type 2 destiné à exécuter plusieurs systèmes invités sur un ordinateur hôte.','Une VM VMware s’appuie notamment sur un fichier de configuration .vmx et un ou plusieurs disques virtuels .vmdk.','Le choix de VMware dépend du poste hôte, des fonctions nécessaires et des conditions de licence en vigueur.'],uses:['Créer rapidement des VM Windows ou Linux sur un poste enseignant','Préparer un Lab hors ligne pour les élèves','Tester un service sans modifier le système hôte'],sec:['Télécharger VMware depuis une source officielle.','Conserver l’hôte et VMware à jour.','Ne pas considérer une VM comme une frontière de sécurité absolue.'],practice:'Repérer dans le dossier d’une VM les fichiers .vmx et .vmdk puis identifier leur rôle.',check:'Être capable d’expliquer ce qui est propre à la VM et ce qui dépend de l’hôte VMware.'},",
                  r"{id:'W02',track:'VMware',lvl:2,title:'Créer et paramétrer une VM VMware propre',know:['Le choix CPU, RAM, disque, firmware, ISO et réseau doit correspondre à l’objectif du Lab.','Une convention de nommage et une fiche de paramètres facilitent la duplication et le dépannage.','VMware Tools améliore notamment l’intégration et fournit des pilotes adaptés selon le système invité.'],uses:['Debian CLI','Windows client','Windows Server'],sec:['Limiter les périphériques, dossiers partagés et fonctions d’intégration au strict besoin du Lab.','Ne pas surallouer la RAM d’un poste de salle.'],practice:'Créer une VM Debian légère, choisir ses ressources, monter l’ISO, installer le système puis vérifier VMware Tools.',check:'La VM démarre avec les ressources prévues et la fiche de configuration est complète.'},",
                  r"{id:'W03',track:'VMware',lvl:2,title:'Réseaux VMware : NAT, bridge, host-only et VMnet',know:['Le mode NAT permet généralement à la VM de sortir via l’hôte sans apparaître directement comme une nouvelle machine sur le LAN.','Le mode bridge relie la VM au réseau physique choisi.','Le mode host-only crée un réseau privé entre l’hôte et les VM ; les réseaux VMnet permettent de construire plusieurs segments virtuels selon l’édition et la configuration.'],uses:['Accès Internet depuis une VM','Lab isolé entre plusieurs VM','Connexion à un switch autonome via une carte réseau dédiée'],sec:['Ne pas utiliser le bridge sur le réseau établissement sans validation.','Éviter tout serveur DHCP parasite sur un réseau réel.','Documenter précisément quel VMnet correspond à quel usage.'],practice:'Créer un scénario NAT puis un scénario host-only et relever adresse IP, route par défaut et connectivité.',check:'Une matrice indique clairement VM→hôte, VM→VM, VM→Internet et VM→LAN pour chaque mode.'},",
                  r"{id:'W04',track:'VMware',lvl:2,title:'Snapshots, clones et duplication d’un Lab VMware',know:['Un snapshot mémorise un état de VM utile pour revenir rapidement en arrière pendant un TP.','Un clone crée une nouvelle VM dérivée ; le niveau d’indépendance dépend du type de clone disponible.','Une longue chaîne de snapshots augmente la complexité et ne remplace pas une sauvegarde.'],uses:['Remise à zéro d’un TP','Créer un poste par binôme','Préparer une panne contrôlée'],sec:['Créer un snapshot à un état réellement propre.','Ne pas conserver indéfiniment les snapshots.','Protéger les dossiers contenant les fichiers des VM.'],practice:'Créer un snapshot avant modification, provoquer une panne, revenir au snapshot puis cloner la VM de référence.',check:'La VM revient à l’état attendu et la différence snapshot/clone/sauvegarde est expliquée.'},",
                  r"{id:'W05',track:'VMware',lvl:2,title:'Importer et exporter OVF / OVA avec VMware',know:['OVF décrit une appliance virtuelle ; OVA regroupe généralement la description et les disques dans une archive unique.','L’export OVF/OVA facilite le transfert d’un Lab vers un autre poste ou un autre hyperviseur compatible.','Certaines caractéristiques matérielles ou fonctions propriétaires peuvent nécessiter une adaptation après import.'],uses:['Distribuer une appliance aux collègues','Archiver une VM pédagogique','Préparer une migration vers VirtualBox'],sec:['Supprimer secrets, données personnelles et clés avant export.','Vérifier la provenance d’une appliance importée.','Mettre à jour le système après import.'],practice:'Exporter une petite VM en OVF/OVA, la retirer du catalogue local puis la réimporter.',check:'La VM réimportée démarre et le réseau ainsi que le stockage sont vérifiés.'},",
                  r"{id:'W06',track:'VMware',lvl:3,title:'Passer une VM VMware vers VirtualBox et inversement',know:['La méthode à privilégier est l’échange d’une appliance OVF/OVA lorsque les deux hyperviseurs la prennent correctement en charge.','VMware utilise couramment VMDK ; VirtualBox sait utiliser VMDK et son format natif VDI.','Les snapshots ne se transfèrent pas comme une simple image disque : on migre de préférence une VM arrêtée et consolidée.'],uses:['Réutiliser un Lab VMware dans une salle équipée de VirtualBox','Transformer une appliance VirtualBox pour un poste VMware','Conserver un même scénario pédagogique malgré un changement d’hyperviseur'],sec:['Faire une copie de la VM avant conversion.','Éteindre complètement la VM avant export ou conversion du disque.','Après migration, contrôler firmware BIOS/UEFI, contrôleur disque, cartes réseau, adresse MAC, activation éventuelle de Windows et outils invités.','Les VM chiffrées, TPM virtuels ou fonctions spécifiques à un hyperviseur peuvent nécessiter un traitement particulier.'],practice:'Méthode A — recommandée : exporter la VM source en OVF/OVA puis l’importer dans l’autre hyperviseur.\n\nMéthode B — disque seul avec VirtualBox :\n# VDI vers VMDK pour VMware\nVBoxManage clonemedium disk source.vdi destination.vmdk --format VMDK\n\n# VMDK vers VDI pour VirtualBox\nVBoxManage clonemedium disk source.vmdk destination.vdi --format VDI\n\nCréer ensuite une nouvelle VM dans l’hyperviseur cible et attacher le disque converti. Réinstaller ou adapter VMware Tools / Guest Additions si nécessaire.',check:'La VM démarre dans l’hyperviseur cible, le disque est reconnu, le réseau fonctionne et les outils invités correspondent au nouvel hyperviseur.'},"
              ]
              s = s[:pos] + '\n'.join(vmware) + '\n' + s[pos:]

          s = s.replace("const tracks=['Tous','Socle','Poste local','Docker','Proxmox','Réseau','AD','Cloud','Pédagogie'];", "const tracks=['Tous','Socle','Poste local','VMware','Docker','Proxmox','Réseau','AD','Cloud','Pédagogie'];", 1)
          s = s.replace("const labels={S:'SOCLE',H:'POSTE LOCAL',D:'DOCKER',P:'PROXMOX'", "const labels={S:'SOCLE',H:'POSTE LOCAL',W:'VMWARE',D:'DOCKER',P:'PROXMOX'", 1)

          old_tags = "D15:['DOCKER','STACK COMPLÈTE','NGINX','PORTAINER','SUPERVISION'],P01:"
          new_tags = "D15:['DOCKER','STACK COMPLÈTE','NGINX','PORTAINER','SUPERVISION'],W01:['VMWARE','WORKSTATION','TYPE 2','VMX / VMDK'],W02:['VMWARE','CRÉATION VM','VMWARE TOOLS','RESSOURCES'],W03:['VMWARE','RÉSEAU','NAT / BRIDGE / HOST-ONLY','VMNET'],W04:['VMWARE','SNAPSHOTS','CLONES','REMISE À ZÉRO'],W05:['VMWARE','OVF / OVA','IMPORT / EXPORT'],W06:['VMWARE ↔ VIRTUALBOX','CONVERSION','OVF / OVA','VMDK / VDI'],P01:"
          s = s.replace(old_tags, new_tags, 1)

          ref_anchor = '<a href="https://www.virtualbox.org/wiki/Documentation" target="_blank" rel="noreferrer">Oracle VirtualBox — documentation</a>'
          vmref = '<a href="https://techdocs.broadcom.com/us/en/vmware-cis/desktop-hypervisors/workstation-pro/17-0.html" target="_blank" rel="noreferrer">VMware Workstation Pro — documentation technique</a>'
          if 'VMware Workstation Pro — documentation technique' not in s:
              s = s.replace(ref_anchor, vmref + ref_anchor, 1)

          s = s.replace('Docker, Proxmox, poste local, réseau, AD ou cloud selon les besoins.', 'Docker, VMware, Proxmox, poste local, réseau, AD ou cloud selon les besoins.', 1)
          s = s.replace('installation, réseau, OVA/OVF, images Docker, sauvegarde, Active Directory, cloud, etc.', 'installation, réseau, OVA/OVF, images Docker, VMware, conversion VMware ↔ VirtualBox, sauvegarde, Active Directory, cloud, etc.', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Enregistrer les modifications
        shell: bash
        run: |
          git config user.name "jaycikomo"
          git config user.email "47773376+jaycikomo@users.noreply.github.com"
          git add lab/capsules-approfondies.html
          git diff --cached --quiet || git commit -m "Ajouter capsules VMware et conversion VirtualBox"
          git push
