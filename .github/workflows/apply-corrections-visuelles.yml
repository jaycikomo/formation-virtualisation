name: Approfondir parcours Docker

on:
  push:
    paths:
      - '.github/workflows/apply-corrections-visuelles.yml'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter reseau Compose Portainer et supervision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lab/capsules-approfondies.html')
          s = p.read_text(encoding='utf-8')
          if "id:'D11'" not in s:
              marker = "{id:'P01',track:'Proxmox'"
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('Point insertion Proxmox introuvable')
              lines = [
                  r"{id:'D11',track:'Docker',lvl:2,title:'Réseau Docker approfondi : réseaux, DNS et segmentation',know:['Un réseau bridge utilisateur permet aux conteneurs de communiquer par nom grâce au DNS Docker.','Un port publié rend un service accessible depuis l’hôte ; un port interne peut rester uniquement accessible aux conteneurs du même réseau.','Un conteneur peut appartenir à plusieurs réseaux Docker selon son rôle.'],uses:['Front-end et base sur réseaux distincts','Supervision d’un service sans publier tous ses ports','Lab multi-services reproductible'],sec:['Ne pas publier une base de données si seul le front-end doit y accéder.','Limiter les ports exposés et choisir l’interface d’écoute adaptée.','La segmentation Docker réduit l’exposition mais ne remplace pas une politique de sécurité complète.'],practice:'docker network create ciel-front\ndocker network create ciel-back\ndocker run -d --name web --network ciel-front nginx:stable\ndocker run --rm --network ciel-front alpine getent hosts web\ndocker network connect ciel-back web\ndocker network inspect ciel-front',check:'Expliquer quel service est visible depuis quel réseau et pourquoi le nom web est résolu sans IP fixe.'},",
                  r"{id:'D12',track:'Docker',lvl:2,title:'Fichier compose.yaml / .yml : créer plusieurs services',know:['Compose décrit un Lab dans un fichier YAML : services, images ou build, ports, volumes et réseaux.','depends_on ordonne le démarrage mais ne garantit pas à lui seul que l’application est prête.','docker compose config permet de vérifier et normaliser le fichier avant déploiement.'],uses:['Déployer plusieurs services avec une seule commande','Distribuer le même Lab à chaque binôme','Versionner la configuration pédagogique'],sec:['Ne pas placer de mot de passe réel directement dans le fichier YAML.','Utiliser .env ou des mécanismes de secrets adaptés selon le contexte.','Publier uniquement les ports nécessaires.'],practice:'services:\n  web:\n    image: nginx:stable-alpine\n    ports:\n      - \"8080:80\"\n    networks:\n      - cielnet\n  test:\n    image: alpine\n    command: [\"sleep\", \"3600\"]\n    networks:\n      - cielnet\nnetworks:\n  cielnet:\n\n# puis\ndocker compose config\ndocker compose up -d\ndocker compose ps\ndocker compose logs\ndocker compose down',check:'Le Lab complet est recréé à partir du seul fichier compose.yaml/.yml et les deux services se retrouvent sur le même réseau.'},",
                  r"{id:'D13',track:'Docker',lvl:2,title:'Portainer : administrer Docker avec une interface Web',know:['Portainer permet de visualiser conteneurs, images, réseaux, volumes et stacks depuis une interface Web.','Une Stack Portainer correspond à un déploiement déclaratif basé notamment sur Compose.','L’accès au socket Docker donne à Portainer des capacités d’administration très élevées sur l’hôte.'],uses:['Rendre Docker plus lisible pour un premier Lab','Visualiser rapidement réseaux, volumes et états des conteneurs','Déployer une Stack à partir d’un fichier YAML'],sec:['Accès Portainer réservé au réseau de management ou au poste local.','Protéger le compte administrateur et utiliser HTTPS.','Le montage /var/run/docker.sock est très privilégié : ne jamais l’exposer à un conteneur non maîtrisé.','Ne pas ouvrir le port 8000 si les fonctions Edge ne sont pas utilisées.'],practice:'docker volume create portainer_data\ndocker run -d --name portainer --restart=always -p 9443:9443 -v /var/run/docker.sock:/var/run/docker.sock -v portainer_data:/data portainer/portainer-ce:lts\n# ouvrir ensuite https://IP_DU_SERVEUR:9443',check:'Depuis Portainer, retrouver l’image Nginx, le réseau cielnet, les volumes et l’état des conteneurs sans utiliser la ligne de commande.'},",
                  r"{id:'D14',track:'Docker',lvl:2,title:'Supervision avec Uptime Kuma',know:['Uptime Kuma supervise notamment HTTP(S), TCP, ping et DNS et conserve un historique de disponibilité.','Une supervision externe vérifie le service vu par un client ; un healthcheck Docker vérifie plutôt l’état déclaré d’un conteneur.','La supervision doit elle-même conserver ses données dans un volume.'],uses:['Surveiller un serveur Web de TP','Créer un tableau de disponibilité des services du Lab','Introduire observabilité et diagnostic'],sec:['Limiter l’exposition de l’interface de supervision.','Utiliser un compte dédié et activer les protections disponibles.','Les données de supervision peuvent révéler l’architecture du Lab : ne pas les publier inutilement.'],practice:'docker volume create uptime-kuma\ndocker run -d --restart=always -p 127.0.0.1:3001:3001 -v uptime-kuma:/app/data --name uptime-kuma louislam/uptime-kuma:2\n# ouvrir http://localhost:3001 puis créer un moniteur HTTP',check:'Un service Web est surveillé, une coupure volontaire est détectée puis le retour à la normale apparaît dans l’historique.'},",
                  r"{id:'D15',track:'Docker',lvl:3,title:'Stack complète : Nginx + Portainer + Uptime Kuma',know:['Un même Lab peut combiner service applicatif, administration et supervision dans un fichier Compose.','Les réseaux et volumes définis dans Compose rendent l’architecture visible et reproductible.','Uptime Kuma peut joindre un service du même réseau par son nom DNS Docker sans connaître son adresse IP.'],uses:['Lab final Docker pour les élèves','Mini-infrastructure de services supervisée','Démonstration complète réseau + YAML + administration + supervision'],sec:['Portainer reste un service d’administration et ne doit pas être exposé comme un service utilisateur.','Le socket Docker est monté uniquement dans Portainer, pas dans Nginx ni Uptime Kuma.','Conserver les volumes de Portainer et Uptime Kuma et tester leur restauration.'],practice:'services:\n  web:\n    image: nginx:stable-alpine\n    ports:\n      - \"127.0.0.1:8080:80\"\n    networks: [monitoring]\n  kuma:\n    image: louislam/uptime-kuma:2\n    ports:\n      - \"127.0.0.1:3001:3001\"\n    volumes:\n      - kuma_data:/app/data\n    networks: [monitoring]\n  portainer:\n    image: portainer/portainer-ce:lts\n    ports:\n      - \"127.0.0.1:9443:9443\"\n    volumes:\n      - /var/run/docker.sock:/var/run/docker.sock\n      - portainer_data:/data\nvolumes:\n  kuma_data:\n  portainer_data:\nnetworks:\n  monitoring:\n\n# puis\ndocker compose up -d\ndocker compose ps\n# dans Uptime Kuma, surveiller http://web:80',check:'Nginx fonctionne, Portainer affiche les ressources Docker et Uptime Kuma détecte l’arrêt puis le redémarrage volontaire du service web.'},"
              ]
              s = s[:pos] + '\n'.join(lines) + '\n' + s[pos:]
          old_tags = "D10:['DOCKER','SÉCURISATION','LOGS','DIAGNOSTIC'],P01:"
          new_tags = "D10:['DOCKER','SÉCURISATION','LOGS','DIAGNOSTIC'],D11:['DOCKER','RÉSEAU','DNS','SEGMENTATION'],D12:['DOCKER','COMPOSE.YAML / .YML','SERVICES','RÉSEAUX / VOLUMES'],D13:['DOCKER','PORTAINER','STACKS','ADMINISTRATION WEB'],D14:['DOCKER','UPTIME KUMA','SUPERVISION','HEALTHCHECK'],D15:['DOCKER','STACK COMPLÈTE','NGINX','PORTAINER','SUPERVISION'],P01:"
          s = s.replace(old_tags, new_tags, 1)
          s = s.replace('<li>Nginx sur port 8080</li><li>Volume de contenu</li><li>Panne : mauvais mapping de port</li><li>Retour : compose.yaml</li>', '<li>Nginx sur port 8080</li><li>Réseau Docker + compose.yaml</li><li>Portainer + Uptime Kuma</li><li>Panne : mauvais port ou mauvais réseau</li><li>Retour : compose.yaml + volumes</li>', 1)
          s = s.replace("tech:'Debian · Docker · Nginx'", "tech:'Debian · Docker · Nginx · Portainer · Uptime Kuma'", 1)
          s = s.replace("mission:'Récupérer l’image, lancer Nginx, publier le port, modifier le contenu via un volume puis recréer le conteneur.'", "mission:'Créer le réseau Docker, déployer plusieurs services avec compose.yaml, vérifier les services dans Portainer, configurer Uptime Kuma puis provoquer une coupure contrôlée et observer la supervision.'", 1)
          s = s.replace("resources:'Debian préparée, Docker installé ou kit d’images hors ligne, compose.yaml de secours.'", "resources:'Debian préparée, Docker installé ou kit d’images hors ligne, compose.yaml, images Nginx/Portainer/Uptime Kuma préchargées et fiche réseau.'", 1)
          anchor = '<a href="https://docs.docker.com/get-started/docker-concepts/" target="_blank" rel="noreferrer">Docker Docs — concepts, images, conteneurs, stockage et réseaux</a>'
          if 'Portainer CE — installation Docker et Compose' not in s:
              s = s.replace(anchor, anchor + '<a href="https://docs.portainer.io/start/install-ce/server/docker/linux" target="_blank" rel="noreferrer">Portainer CE — installation Docker et Compose</a><a href="https://github.com/louislam/uptime-kuma" target="_blank" rel="noreferrer">Uptime Kuma — supervision avec Docker</a>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Enregistrer les modifications
        shell: bash
        run: |
          git config user.name "jaycikomo"
          git config user.email "47773376+jaycikomo@users.noreply.github.com"
          git add lab/capsules-approfondies.html
          git diff --cached --quiet || git commit -m "Approfondir Docker reseau Compose Portainer supervision"
          git push
