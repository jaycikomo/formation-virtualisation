name: Ajout objectif final et constructeur de ressource

on:
  push:
    paths:
      - '.github/workflows/ajout-objectif-final.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrichir la page capsules approfondies
        shell: python
        run: |
          from pathlib import Path
          p = Path('lab/capsules-approfondies.html')
          s = p.read_text(encoding='utf-8')

          if 'id="constructeur-lab"' in s:
              print('Section deja presente')
              raise SystemExit(0)

          css = r'''
.final-stage{background:#fff;padding:54px 0 60px;border-top:10px solid var(--orange);border-bottom:1px solid var(--line)}
.final-banner{background:var(--ink);color:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 45px rgba(17,21,27,.14)}
.final-banner .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;color:#ffb36f}
.final-banner h2{font-size:clamp(34px,5vw,58px);line-height:.98;margin:8px 0 12px}.final-banner>p{color:#c8d0d9;max-width:900px;font-size:17px}
.final-chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}.final-chain div{border:1px solid #39424c;border-radius:12px;padding:12px;background:#1a2027}.final-chain b{display:block;color:#fff}.final-chain span{font-size:12px;color:#b8c1cb}
.example-title{margin:34px 0 8px}.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.example{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;border-top:5px solid var(--blue)}.example:nth-child(2){border-top-color:var(--green)}.example:nth-child(3){border-top-color:var(--orange)}.example:nth-child(4){border-top-color:var(--brown)}.example .code{font:900 11px Consolas,monospace;color:var(--muted)}.example h3{font-size:18px;line-height:1.15;margin:7px 0}.example p{font-size:13px;color:var(--muted)}.example ul{padding-left:18px;font-size:13px}.example button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}
.builder-wrap{margin-top:32px;background:#f4f6f8;border:1px solid var(--line);border-radius:22px;padding:22px}.builder-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.builder-head h2{margin-bottom:5px}.builder-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:18px}.builder-form,.builder-preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.bform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bfield{display:grid;gap:5px}.bfield.full{grid-column:1/-1}.bfield label{font-size:12px;font-weight:900}.bfield input,.bfield select,.bfield textarea{width:100%;border:1px solid #b9c3cd;border-radius:9px;padding:9px 10px;background:#fff;font:inherit}.bfield textarea{min-height:75px;resize:vertical}.builder-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.builder-actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.bprimary{background:var(--orange);color:#fff}.bsecondary{background:var(--ink);color:#fff}.bghost{background:#fff;border:1px solid var(--line)!important}.builder-preview{position:relative}.builder-preview:before{content:'FICHE LAB ÉLÈVES';position:absolute;right:14px;top:12px;font:900 10px Consolas,monospace;color:var(--orange);letter-spacing:.12em}.builder-preview h3{font-size:24px;margin:0 0 3px;padding-right:120px}.pvmeta{font-size:12px;color:var(--muted)}.pvblock{margin-top:14px}.pvblock b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.pvblock p{white-space:pre-wrap;margin:4px 0 0}.criteria-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.criterion{border:1px solid #39424c;border-radius:12px;padding:12px;background:#1a2027}.criterion b{display:block;color:#fff}.criterion span{font-size:12px;color:#b8c1cb}
@media(max-width:900px){.final-chain,.examples,.criteria-grid{grid-template-columns:1fr 1fr}.builder-grid{grid-template-columns:1fr}}
@media(max-width:580px){.final-chain,.examples,.criteria-grid,.bform-grid{grid-template-columns:1fr}.bfield.full{grid-column:auto}.builder-preview h3{padding-right:0;padding-top:20px}}
@media print{body *{visibility:hidden!important}#lab-print,#lab-print *{visibility:visible!important}#lab-print{position:absolute;left:0;top:0;width:100%;border:0!important}.builder-actions{display:none!important}}
'''
          s = s.replace('</style>', css + '\n</style>', 1)

          anchor = '<section class="section white"><div class="wrap"><h2>Références techniques de la formation</h2>'
          block = r'''
<section class="final-stage" id="constructeur-lab"><div class="wrap">
  <div class="final-banner">
    <div class="kicker">Objectif final · production enseignant</div>
    <h2>Je crée une ressource : un Lab pour mes élèves</h2>
    <p>La formation se termine par une production concrète. Chaque participant choisit les briques qu'il a réellement travaillées et construit une ressource pédagogique réutilisable avec ses élèves de Bac Pro CIEL.</p>
    <div class="final-chain"><div><b>1 · CHOISIR</b><span>un besoin pédagogique</span></div><div><b>2 · ARCHITECTURER</b><span>VM, conteneurs, réseau</span></div><div><b>3 · SÉCURISER</b><span>isolement, droits, secrets</span></div><div><b>4 · FAIRE AGIR</b><span>mission élève et incident</span></div><div><b>5 · RESTAURER</b><span>snapshot, sauvegarde, remise à zéro</span></div></div>
    <div class="criteria-grid"><div class="criterion"><b>Réutilisable</b><span>Le lab peut être relancé avec une autre classe.</span></div><div class="criterion"><b>Observable</b><span>La réussite se prouve par un résultat technique.</span></div><div class="criterion"><b>Réparable</b><span>Une panne ou erreur peut être diagnostiquée.</span></div><div class="criterion"><b>Isolable</b><span>Le lab n'expose pas inutilement le réseau établissement.</span></div><div class="criterion"><b>Restaurable</b><span>Un état propre permet de recommencer rapidement.</span></div><div class="criterion"><b>Documenté</b><span>Un autre enseignant peut comprendre l'architecture.</span></div></div>
  </div>

  <h2 class="example-title">Quatre exemples de Labs élèves</h2>
  <p class="lead">Ces exemples servent de point de départ. Ils montrent qu'un Lab final peut être très différent selon le parcours choisi.</p>
  <div class="examples">
    <article class="example"><div class="code">EXEMPLE 01 · AD</div><h3>Mini-domaine CIEL</h3><p>Créer un domaine isolé et intégrer un poste client.</p><ul><li>DC01 : 192.168.10.10</li><li>PC01 : 192.168.10.21</li><li>Domaine : ciel.lan</li><li>Panne : DNS client incorrect</li><li>Retour : snapshot domaine-ok</li></ul><button type="button" data-example="ad">Utiliser cet exemple</button></article>
    <article class="example"><div class="code">EXEMPLE 02 · DOCKER</div><h3>Service Web conteneurisé</h3><p>Déployer un site Nginx, comprendre image, port et volume.</p><ul><li>Debian + Docker</li><li>Nginx sur port 8080</li><li>Volume de contenu</li><li>Panne : mauvais mapping de port</li><li>Retour : compose.yaml</li></ul><button type="button" data-example="docker">Utiliser cet exemple</button></article>
    <article class="example"><div class="code">EXEMPLE 03 · PROXMOX</div><h3>Serveur de Lab isolé</h3><p>Déployer deux VM sur un bridge de laboratoire.</p><ul><li>Proxmox physique</li><li>vmbr-LAB isolé</li><li>1 Linux + 1 client</li><li>Panne : mauvaise vNIC</li><li>Retour : sauvegarde/clone</li></ul><button type="button" data-example="proxmox">Utiliser cet exemple</button></article>
    <article class="example"><div class="code">EXEMPLE 04 · RÉSEAU</div><h3>Panne mystère</h3><p>Faire diagnostiquer une rupture de communication entre deux VM.</p><ul><li>2 VM sur LAN interne</li><li>Plan IPv4 fourni</li><li>Erreur volontaire DNS/IP</li><li>Méthode de diagnostic</li><li>Preuve : service joignable</li></ul><button type="button" data-example="reseau">Utiliser cet exemple</button></article>
  </div>

  <div class="builder-wrap">
    <div class="builder-head"><div><div class="eyebrow" style="color:var(--orange)">Construire ma ressource</div><h2>Mon Lab pédagogique</h2><p class="lead">Renseigne les choix du Lab. La fiche à droite se construit automatiquement et peut ensuite être enregistrée en PDF.</p></div></div>
    <div class="builder-grid">
      <form class="builder-form" id="lab-form">
        <div class="bform-grid">
          <div class="bfield full"><label for="b-title">Titre du Lab</label><input id="b-title" placeholder="Ex. Déployer un service Web avec Docker"></div>
          <div class="bfield"><label for="b-class">Classe / niveau</label><input id="b-class" placeholder="Première CIEL"></div>
          <div class="bfield"><label for="b-duration">Durée</label><input id="b-duration" placeholder="2 h"></div>
          <div class="bfield full"><label for="b-context">Contexte professionnel</label><textarea id="b-context" placeholder="Situation proposée aux élèves..."></textarea></div>
          <div class="bfield full"><label for="b-objective">Objectif élève</label><textarea id="b-objective" placeholder="À l'issue du Lab, l'élève est capable de..."></textarea></div>
          <div class="bfield"><label for="b-tech">Technologies</label><input id="b-tech" placeholder="Proxmox, Docker, Windows Server..."></div>
          <div class="bfield"><label for="b-network">Réseau</label><input id="b-network" placeholder="LAN interne, NAT, bridge isolé..."></div>
          <div class="bfield full"><label for="b-architecture">Architecture du Lab</label><textarea id="b-architecture" placeholder="VM, IP, services, conteneurs, vNIC..."></textarea></div>
          <div class="bfield full"><label for="b-security">Critères de sécurité</label><textarea id="b-security" placeholder="Isolement, droits minimaux, ports, secrets, mises à jour..."></textarea></div>
          <div class="bfield full"><label for="b-mission">Mission confiée aux élèves</label><textarea id="b-mission" placeholder="Ce que les élèves doivent réellement faire..."></textarea></div>
          <div class="bfield full"><label for="b-fault">Incident / panne à diagnostiquer</label><textarea id="b-fault" placeholder="Erreur volontaire ou situation de diagnostic..."></textarea></div>
          <div class="bfield"><label for="b-restore">Retour à l'état initial</label><input id="b-restore" placeholder="Snapshot, clone, backup..."></div>
          <div class="bfield"><label for="b-proof">Preuve de réussite</label><input id="b-proof" placeholder="Ping, page Web, GPO, journal..."></div>
          <div class="bfield full"><label for="b-resources">Ressources nécessaires</label><textarea id="b-resources" placeholder="ISO, OVA, switch, fiche élève, fichiers hors ligne..."></textarea></div>
        </div>
        <div class="builder-actions"><button type="button" class="bsecondary" id="b-example">Charger l'exemple complet</button><button type="button" class="bprimary" id="b-print">Enregistrer la fiche en PDF</button><button type="reset" class="bghost">Effacer</button></div>
      </form>
      <article class="builder-preview" id="lab-print"><h3 id="pv-title">Mon Lab pédagogique</h3><div class="pvmeta" id="pv-meta">Classe · durée</div><div class="pvblock"><b>Contexte professionnel</b><p id="pv-context">À définir.</p></div><div class="pvblock"><b>Objectif élève</b><p id="pv-objective">À définir.</p></div><div class="pvblock"><b>Technologies et réseau</b><p id="pv-tech">À définir.</p></div><div class="pvblock"><b>Architecture</b><p id="pv-architecture">À définir.</p></div><div class="pvblock"><b>Sécurité</b><p id="pv-security">À définir.</p></div><div class="pvblock"><b>Mission élève</b><p id="pv-mission">À définir.</p></div><div class="pvblock"><b>Incident à diagnostiquer</b><p id="pv-fault">À définir.</p></div><div class="pvblock"><b>Restauration et preuve</b><p id="pv-restore">À définir.</p></div><div class="pvblock"><b>Ressources</b><p id="pv-resources">À définir.</p></div></article>
    </div>
  </div>
</div></section>
<script>
(()=>{
 const ids=['title','class','duration','context','objective','tech','network','architecture','security','mission','fault','restore','proof','resources'];
 const g=id=>document.getElementById('b-'+id), txt=(id,f='À définir.')=>(g(id).value.trim()||f);
 function render(){document.getElementById('pv-title').textContent=txt('title','Mon Lab pédagogique');document.getElementById('pv-meta').textContent=txt('class','Classe')+' · '+txt('duration','durée');document.getElementById('pv-context').textContent=txt('context');document.getElementById('pv-objective').textContent=txt('objective');document.getElementById('pv-tech').textContent=txt('tech')+'\nRéseau : '+txt('network');document.getElementById('pv-architecture').textContent=txt('architecture');document.getElementById('pv-security').textContent=txt('security');document.getElementById('pv-mission').textContent=txt('mission');document.getElementById('pv-fault').textContent=txt('fault');document.getElementById('pv-restore').textContent='Retour à l’état initial : '+txt('restore')+'\nPreuve attendue : '+txt('proof');document.getElementById('pv-resources').textContent=txt('resources')}
 ids.forEach(id=>g(id).addEventListener('input',render));document.getElementById('lab-form').addEventListener('reset',()=>setTimeout(render,0));
 const examples={
 ad:{title:'Mini-domaine CIEL : AD, DNS et poste client',class:'Première CIEL',duration:'2 h',context:'Le service informatique doit préparer un domaine de test totalement isolé du réseau de production.',objective:'Déployer un contrôleur de domaine, configurer le DNS et intégrer un poste client.',tech:'VirtualBox ou Proxmox · Windows Server · Windows client',network:'LAN-CIEL 192.168.10.0/24, réseau interne isolé',architecture:'DC01 192.168.10.10\nPC01 192.168.10.21\nDomaine : ciel.lan\nDNS client : 192.168.10.10',security:'Réseau isolé ; comptes de lab uniquement ; mots de passe de TP non réutilisés ; pare-feu conservé ; aucune liaison au réseau établissement sans autorisation.',mission:'Installer/configurer DC01, créer le domaine ciel.lan, créer un utilisateur et joindre PC01 au domaine.',fault:'PC01 reçoit volontairement un mauvais DNS. L’élève doit expliquer pourquoi le domaine est inaccessible puis corriger la configuration.',restore:'Snapshot domaine-ok',proof:'PC01 rejoint ciel.lan et ouvre une session avec le compte créé',resources:'ISO Windows Server et client, fiche plan IP, snapshot initial.'},
 docker:{title:'Déployer un service Web avec Docker',class:'Première CIEL',duration:'1 h 30',context:'Une équipe doit publier rapidement un service Web de test sans installer un serveur complet supplémentaire.',objective:'Comprendre image, conteneur, port et volume puis rendre un service Web persistant.',tech:'Debian · Docker · Nginx',network:'NAT ou LAN interne selon le scénario',architecture:'LINUX01 192.168.10.30\nConteneur nginx\nPort hôte 8080 vers 80\nVolume pour le contenu Web',security:'Image officielle/maintenue ; pas de secret dans l’image ; aucun --privileged ; ports publiés uniquement si nécessaires ; mises à jour prévues.',mission:'Récupérer l’image, lancer Nginx, publier le port, modifier le contenu via un volume puis recréer le conteneur.',fault:'Le port est volontairement publié 8081:80 alors que la documentation du Lab annonce 8080.',restore:'docker compose down puis redéploiement',proof:'Page personnalisée accessible sur le port 8080 après recréation',resources:'Debian préparée, Docker installé ou kit d’images hors ligne, compose.yaml de secours.'},
 proxmox:{title:'Déployer un Lab isolé sur Proxmox',class:'Terminale CIEL',duration:'2 h 30',context:'Un établissement souhaite héberger plusieurs environnements de TP sur un serveur dédié sans exposer directement les VM au réseau pédagogique.',objective:'Créer un réseau virtuel isolé, déployer deux VM et prévoir leur restauration.',tech:'Proxmox VE · VM Linux/client',network:'Bridge de Lab isolé distinct du réseau de management',architecture:'Proxmox physique\nvmbr0 : management autorisé\nvmbr-LAB : sans port physique\nVM1 Linux + VM2 client',security:'Accès d’administration limité ; comptes nominatifs ; management séparé du Lab ; sauvegardes testées ; pas de bridge sur réseau établissement sans validation.',mission:'Créer le bridge isolé, déployer les deux VM, configurer leurs vNIC puis vérifier leur communication.',fault:'Une VM est volontairement raccordée au mauvais bridge.',restore:'Backup ou clone de référence',proof:'Les deux VM communiquent sur le Lab tout en restant isolées du réseau établissement',resources:'Serveur Proxmox, ISO/OVA, plan réseau et sauvegarde de référence.'},
 reseau:{title:'Panne mystère sur un réseau virtualisé',class:'Seconde / Première CIEL',duration:'1 h',context:'Deux services virtualisés ne communiquent plus après une modification de configuration.',objective:'Appliquer une méthode de diagnostic structurée sur un réseau de VM.',tech:'Hyperviseur de poste · 2 VM Linux',network:'Réseau interne 192.168.10.0/24',architecture:'VM-A 192.168.10.21/24\nVM-B 192.168.10.22/24\nService Web sur VM-B',security:'Ne pas désactiver le pare-feu globalement ; conserver le Lab isolé ; documenter chaque modification ; ne pas utiliser de mots de passe réels.',mission:'Diagnostiquer de la couche liaison jusqu’au service : vNIC, IP, masque, route, DNS, port, service et pare-feu.',fault:'Une erreur IP ou DNS est injectée avant le début du TP.',restore:'Snapshot depart-panne',proof:'Service Web joignable et cause racine expliquée',resources:'Deux VM préparées, fiche méthode de diagnostic et snapshot de départ.'}
 };
 function load(key){const e=examples[key];if(!e)return;Object.keys(e).forEach(k=>{if(g(k))g(k).value=e[k]});render();document.getElementById('constructeur-lab').scrollIntoView({behavior:'smooth',block:'start'})}
 document.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.example)));document.getElementById('b-example').addEventListener('click',()=>load('ad'));document.getElementById('b-print').addEventListener('click',()=>{render();window.print()});render();
})();
</script>
'''
          if anchor not in s:
              raise SystemExit('Ancre references introuvable')
          s = s.replace(anchor, block + '\n' + anchor, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/capsules-approfondies.html
          git diff --cached --quiet || git commit -m "Rendre l objectif final visible et ajouter le constructeur de Lab"
          git push
