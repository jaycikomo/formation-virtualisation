function spec(id){const m=C[id];if(!m)return null;const [title,track,duration]=m;let a={id,title,track,duration,mission:'Mettre en œuvre la notion de la capsule dans une situation de Lab CIEL, puis produire une preuve technique compréhensible par un autre enseignant.',product:'Une réalisation fonctionnelle, une preuve observable et une courte fiche de décision réutilisable avec les élèves.',req:['Un poste de formation ou le serveur de Lab prévu pour le parcours.','Les droits nécessaires à la manipulation, sans modifier l’infrastructure de l’établissement hors périmètre autorisé.'],know:[],steps:[],validate:[],challenge:'Modifier un paramètre volontairement, constater l’effet, puis revenir à un état maîtrisé.',reset:'Revenir au snapshot, à la sauvegarde ou à la configuration initiale prévue pour la capsule.',sources:commonSources(track)};

 switch(id){
 case 'S01':add({mission:'Vous devez préparer un TP de découverte Linux sans modifier durablement le PC de salle. Votre tâche est de décider ce qui doit être installé directement et ce qui doit être virtualisé, puis de démontrer l’intérêt du retour arrière.',product:'Un tableau de décision pour 3 situations + une démonstration de snapshot/restauration.',know:[k('Hôte, hyperviseur, invité','L’hôte est la machine physique et son système. L’hyperviseur crée et exécute les machines virtuelles. L’invité est le système installé dans la VM. Une VM isole fortement l’environnement logiciel, mais elle consomme toujours CPU, RAM, stockage et réseau de l’hôte.','brown'),k('Quand la VM apporte un vrai gain','Virtualiser est particulièrement utile quand on veut recommencer rapidement, distribuer le même environnement, tester sans modifier le poste, exécuter un autre OS ou créer plusieurs machines/réseaux sur un seul PC.','blue'),k('Quand l’installation directe peut être meilleure','Si l’objectif porte sur le matériel réel, un pilote, un périphérique USB sensible aux performances ou si le poste manque de ressources, l’installation directe peut être plus pertinente.','orange')],steps:[st('Comparer trois situations',['Situation A : découvrir Debian en ligne de commande.','Situation B : mettre à jour le pilote graphique du poste.','Situation C : tester un serveur Web puis le casser volontairement.','Pour chaque situation, choisissez “installation directe” ou “VM” et donnez deux critères.'],'Un tableau avec 3 choix argumentés.','Ne cherchez pas “VM = toujours mieux”. Le bon choix dépend de l’objectif pédagogique et des contraintes.','orange'),st('Observer les ressources de l’hôte et de la VM',['Lancez une VM légère.','Sur l’hôte, observez CPU et RAM avant/après le démarrage.','Dans la VM, relevez le nombre de vCPU et la RAM attribuée.','Notez ce qui est partagé et ce qui est isolé.'],'Vous pouvez expliquer où se trouvent réellement CPU, RAM et disque.'),st('Démontrer le retour arrière',['Créez un snapshot nommé ETAT-PROPRE.','Dans la VM, créez un fichier ou modifiez un paramètre visible.','Restaurez ETAT-PROPRE.','Vérifiez que la modification a disparu.'],'Une capture avant modification et une après restauration.','Un snapshot est pratique pour un TP, mais ce n’est pas une sauvegarde indépendante. Cette distinction sera travaillée dans S05.','blue'),st('Prendre une décision pédagogique',['Reprenez votre tableau initial.','Ajoutez les critères : isolation, reproductibilité, retour arrière, ressources, accès matériel, temps de préparation.','Choisissez le mode de déploiement pour un futur TP CIEL.'],'Une décision que vous pourriez expliquer à un collègue en une minute.')],validate:['Pour 3 situations, le choix direct/VM est cohérent et justifié avec au moins deux critères.','Vous montrez un retour à l’état initial réellement effectué avec un snapshot.','Vous savez identifier hôte, hyperviseur et invité sur votre schéma.'],sources:['vbox','hyperv','proxmox']});break;
 case 'S02':add({mission:'Choisir entre une plateforme de virtualisation sur poste et un hyperviseur serveur pour deux scénarios CIEL.',know:[k('Type 1','Le principe Type 1 désigne un hyperviseur exécuté au plus près du matériel et utilisé comme plateforme de virtualisation de serveur. Proxmox VE et VMware ESXi sont des exemples. Hyper-V est également classé Type 1 dans son architecture.','blue'),k('Type 2','Un hyperviseur de poste s’exécute dans un système hôte déjà installé. VirtualBox et VMware Workstation sont typiques de cet usage.','brown')],steps:[st('Classer les outils',['Classez Proxmox VE, VirtualBox, VMware Workstation et Hyper-V dans l’architecture qui leur correspond.','Ajoutez : OS hôte nécessaire ? gestion centralisée ? usage salle ? serveur dédié ?'],'Une matrice claire, pas seulement deux colonnes Type 1/Type 2.'),st('Scénario poste élève',['PC Windows 8 Go, un binôme, une VM Debian.','Choisissez une solution et justifiez simplicité, droits nécessaires, ressources et remise à zéro.'],'Un choix défendable pour une salle de classe.'),st('Scénario serveur de Lab',['Serveur dédié 64 Go, plusieurs groupes, accès Web d’administration.','Choisissez une plateforme et expliquez ce que change l’administration centralisée.'],'Un schéma serveur → hyperviseur → VM/LXC → réseaux.')],validate:['Vous classez correctement les architectures et vous expliquez la différence sans utiliser seulement “plus puissant / moins puissant”.','Vous choisissez un outil cohérent pour un poste et un serveur en citant au moins trois critères.']});break;
 case 'S03':add({mission:'Choisir entre VM, conteneur et service cloud pour 6 besoins techniques.',know:[k('VM','Une VM embarque son propre système invité et son noyau. Elle convient quand il faut isoler fortement des systèmes ou utiliser des OS différents.','brown'),k('Conteneur','Un conteneur isole des processus tout en partageant le noyau de l’hôte. Il démarre vite et convient très bien aux services applicatifs reproductibles.','green'),k('Cloud','Le cloud est un mode de consommation. Il peut fournir des VM (IaaS), des plateformes ou des services gérés. “Cloud” ne remplace donc pas directement “VM” ou “conteneur”.','blue')],steps:[st('Trier 6 besoins',['Windows Server AD DS','Nginx temporaire','Base de données de TP avec persistance','Tester un autre noyau Linux','Service disponible sans serveur local','Lab hors ligne reproductible'],'Pour chaque besoin : VM, conteneur, cloud ou combinaison, avec justification.'),st('Comparer le coût d’administration',['Pour trois choix, précisez qui gère le noyau, les mises à jour, le réseau et les données.'],'Un tableau des responsabilités.'),st('Tester un conteneur très simple',['Si Docker est disponible : lancez nginx sur un port local puis supprimez le conteneur.','Comparez le temps de démarrage avec une VM.'],'Une observation factuelle, sans conclure que “conteneur = toujours meilleur”.')],validate:['6 besoins classés avec justification isolation / rapidité / administration / persistance.','Vous savez dire pourquoi Windows Server AD DS est ici mieux placé en VM qu’en simple conteneur Linux.'],sources:['docker','hyperv','ec2']});break;
 case 'S04':add({mission:'Manipuler les principaux fichiers d’une VM et comprendre précisément la différence entre ISO, disque virtuel, OVF et OVA.',know:[k('ISO','Une ISO est un média d’installation. Elle sert à installer un OS ; ce n’est pas une machine virtuelle prête à l’emploi.','brown'),k('OVF ou OVA ?','OVF est un format de description d’appliance. En pratique, on rencontre un fichier .ovf accompagné de disques (souvent .vmdk) et parfois d’un manifeste. OVA regroupe ces éléments dans une seule archive de type TAR. OVA est pratique à distribuer ; OVF est plus facile à inspecter fichier par fichier.','blue'),k('Important lors d’un export','OVF/OVA sert à transporter l’état courant d’une appliance ; la chaîne de snapshots n’est pas décrite dans l’OVF. Après import, contrôlez toujours réseau, firmware, contrôleur disque et adresses MAC.','orange')],steps:[st('Identifier les fichiers',['Repérez une ISO, un VDI/VMDK/QCOW2 et un OVA/OVF fourni.','Pour chacun, notez : installation, disque, configuration ou archive.'],'Une fiche “extension → rôle”.'),st('Inspecter un OVA sans l’importer',['Faites une copie de l’OVA.','Ouvrez ou extrayez l’archive avec un outil TAR/7-Zip.','Repérez le .ovf et le ou les disques.','Ouvrez le .ovf avec un éditeur texte sans le modifier.'],'Vous retrouvez la description XML et les références aux disques.','L’objectif n’est pas de modifier l’OVF à la main, mais de comprendre ce que l’archive contient avant de cliquer sur “Importer”.','green'),st('Importer l’appliance',['Dans l’hyperviseur, utilisez la fonction Importer une appliance.','Contrôlez RAM, CPU, stockage et carte réseau avant validation.','Démarrez et relevez l’adresse IP.'],'La VM importée démarre et ses paramètres sont documentés.'),st('Exporter puis comparer',['Éteignez proprement la VM.','Exportez-la en OVA ou OVF.','Comparez le résultat avec les fichiers sources.'],'Vous savez expliquer ce qui a été empaqueté et ce qui ne l’a pas été.')],validate:['Vous expliquez clairement : ISO ≠ disque virtuel ≠ OVF ≠ OVA.','Vous pouvez montrer le contenu d’un OVA et identifier le fichier OVF et le disque.','L’appliance importée démarre avec un réseau contrôlé.'],sources:['vboxvm','vbox']});break;
 case 'S05':add({mission:'Mettre en pratique snapshot, clone, template et sauvegarde sans les confondre.',know:[k('Snapshot','Point de retour rapide lié à la VM et au stockage de l’hyperviseur. Idéal avant une manipulation risquée.','blue'),k('Clone / template','Un clone crée une nouvelle VM dérivée. Un template est un modèle destiné à générer plusieurs instances. Le niveau d’indépendance d’un clone dépend de l’outil et du type de clone.','green'),k('Sauvegarde','Une sauvegarde doit permettre une restauration après perte ou corruption du stockage source. Un snapshot seul n’est donc pas une stratégie de sauvegarde.','orange')],steps:[st('Créer un état de référence',['Préparez une VM fonctionnelle.','Créez un fichier PREUVE-OK puis arrêtez proprement le service choisi.','Créez le snapshot ETAT-PROPRE.'],'Un état de référence nommé et daté.'),st('Casser puis restaurer',['Supprimez ou modifiez volontairement un élément prévu.','Constatez la panne.','Restaurez le snapshot.'],'Le service revient à l’état de référence.'),st('Dupliquer',['Créez un clone ou une copie selon l’outil.','Renommez la copie et vérifiez MAC / identité / IP selon le scénario.'],'Deux VM démarrables sans collision réseau.'),st('Tester la vraie récupération',['Réalisez une sauvegarde/export selon la plateforme.','Restaurez dans un emplacement différent ou sous un autre nom.'],'Une restauration testée, pas seulement un fichier de sauvegarde présent.')],validate:['Vous savez dire ce que chaque mécanisme protège — et ce qu’il ne protège pas.','La restauration depuis snapshot et depuis sauvegarde a été réellement testée.'],sources:['vboxvm','hvcheck','proxmox']});break;
 case 'S06':add({mission:'Concevoir un Lab qui tient réellement sur un poste de 8 Go de RAM sans lancer toutes les VM simultanément.',know:[k('Budget de ressources','La RAM attribuée aux VM doit laisser une marge suffisante à l’hôte. CPU, stockage et I/O comptent aussi ; le nombre de VM “possibles” n’est pas qu’un calcul de RAM.','brown'),k('Ordonnancement pédagogique','Sur un petit poste, on peut travailler séquentiellement : serveur + un client, puis arrêter le client avant de lancer Linux. La conception du scénario compte autant que le matériel.','green')],steps:[st('Mesurer le poste',['Relevez RAM totale, RAM utilisée au repos, CPU et espace libre.','Calculez une enveloppe raisonnable réservée aux VM.'],'Une fiche de capacité du poste.'),st('Construire trois profils',['DC01 : RAM/CPU/disque.','PC01 : RAM/CPU/disque.','LINUX01 : RAM/CPU/disque.','Ajoutez “quand la VM doit être allumée”.'],'Un tableau de ressources et un ordre de démarrage.'),st('Tester la charge réelle',['Lancez uniquement les VM prévues pour une étape.','Observez RAM, swap/pagination et réactivité.','Ajustez sans passer sous les besoins fonctionnels de l’OS.'],'Un profil final testé, pas théorique.')],validate:['Le plan laisse une marge à l’hôte et précise quelles VM sont simultanées.','Vous pouvez expliquer le principal goulot d’étranglement observé : RAM, CPU ou stockage.']});break;
 case 'H01':add({mission:'Choisir un hyperviseur de poste pour trois salles différentes en intégrant fonctions, compatibilité et licence.',know:[k('Le bon outil dépend du contexte','Comparez OS hôte, simplicité d’installation, réseaux virtuels, snapshots, import/export, droits administrateur, coexistence avec les fonctions Windows et politique de l’établissement.','blue'),k('Licence : vérifier au moment du déploiement','Les conditions évoluent. Utilisez toujours la page officielle du produit au moment où le Lab est déployé, notamment pour les composants additionnels.','orange')],steps:[st('Construire une grille',['Colonnes : VirtualBox, VMware Workstation, Hyper-V.','Lignes : OS hôte, réseau, snapshots, OVA/OVF, ergonomie, droits, licence, usage hors ligne.'],'Une matrice de décision.'),st('Appliquer à trois salles',['Salle A : Windows 11, élèves débutants.','Salle B : besoin VMware existant.','Salle C : politique Microsoft/Hyper-V.','Choisissez et justifiez.'],'Trois décisions distinctes, pas un classement universel.'),st('Préparer le plan B',['Pour chaque outil, notez une solution si VT-x/AMD-V n’est pas exploitable ou si l’installation locale est interdite.'],'Un plan B réaliste : serveur Proxmox accessible par navigateur, poste alternatif ou démo préparée.')],validate:['Chaque choix cite au moins deux critères techniques et un critère d’exploitation/licence.','Le plan B ne repose pas sur la désactivation aléatoire de protections système.'],sources:['vbox','vmware','hyperv']});break;
 case 'H02':add({mission:'Vérifier qu’un poste est réellement prêt à exécuter des VM avant d’installer un Lab.',know:[k('VT-x / AMD-V','La virtualisation matérielle doit être prise en charge par le processeur et disponible pour l’hyperviseur. Selon Windows et les fonctions activées, plusieurs couches de virtualisation peuvent interagir.','brown'),k('BIOS/UEFI','Ne modifiez jamais le firmware d’un poste d’établissement sans autorisation. Commencez par observer l’état et documenter le diagnostic.','red')],steps:[st('Observer Windows',['Ouvrez le Gestionnaire des tâches → Performances → Processeur.','Relevez l’état “Virtualisation”.','Notez version de Windows et RAM.'],'Une capture ou fiche de diagnostic.'),st('Vérifier l’hyperviseur',['Ouvrez l’outil choisi et créez une VM minimale.','Si l’option 64 bits ou l’accélération manque, relevez le message exact.'],'Le symptôme est documenté avant toute modification.'),st('Établir un diagnostic',['Classez la cause probable : firmware, fonction Windows concurrente/complémentaire, droits, installation, ressources.','Proposez le test suivant le moins intrusif.'],'Une démarche de diagnostic ordonnée.')],validate:['Vous produisez une preuve que la virtualisation matérielle est disponible ou un diagnostic précis si elle ne l’est pas.','Aucun réglage BIOS/UEFI n’est modifié sans validation.']});break;
 case 'H03':add({mission:'Créer une VM Debian légère, documentée et réutilisable par un autre binôme.',know:[k('Ressources cohérentes','Attribuer “le maximum” n’est pas une bonne pratique. CPU, RAM et disque doivent répondre au besoin tout en conservant des ressources pour l’hôte.','brown'),k('Reproductibilité','Nom, version de l’ISO, firmware, contrôleur disque et réseau doivent être documentés. Sans cela, un collègue ne peut pas reconstruire la VM.','green')],steps:[st('Préparer la fiche VM',['Nom : CIEL-DEBIAN-BASE.','Définissez CPU, RAM, disque, firmware et réseau avant création.','Notez la source de l’ISO.'],'Une fiche de paramètres avant manipulation.'),st('Créer et installer',['Créez la VM avec les paramètres prévus.','Montez l’ISO et installez Debian avec seulement les composants nécessaires.','Créez un compte de Lab non personnel.'],'La VM démarre sans dépendre d’un compte utilisateur réel.'),st('Contrôler réseau et temps',['Relevez IP, passerelle, DNS.','Testez résolution DNS et connectivité selon le mode réseau choisi.'],'Une petite fiche réseau.'),st('Créer l’état de référence',['Mettez à jour si le contexte le permet.','Nettoyez les fichiers temporaires inutiles.','Créez un snapshot ETAT-BASE.'],'Une VM prête à être clonée ou exportée.')],validate:['Un autre binôme peut recréer la VM avec votre fiche.','La VM démarre, a le réseau prévu et possède un état de référence nommé.']});break;
 case 'H04':add({mission:'Préparer une VM de référence et la dupliquer pour une classe tout en garantissant une remise à zéro rapide.',know:[k('Clone lié / clone complet','Selon l’hyperviseur, un clone lié économise du stockage mais dépend de sa base ; un clone complet est plus autonome mais plus volumineux.','blue'),k('Identité réseau','Une duplication peut nécessiter de contrôler nom de machine, MAC, adresse IP et identité système pour éviter des collisions.','orange')],steps:[st('Créer la référence',['Préparez une VM fonctionnelle et créez le snapshot ETAT-PROPRE.'],'Une base stable.'),st('Créer deux clones',['Créez BINOME-01 et BINOME-02.','Contrôlez MAC, nom d’hôte et IP après démarrage.'],'Deux instances sans conflit.'),st('Tester la remise à zéro',['Sur BINOME-01, provoquez une panne définie.','Restaurez l’état initial.','Chronométrez le retour en service.'],'Temps de remise à zéro mesuré.'),st('Choisir une stratégie classe',['Pour 15 groupes, estimez stockage et temps de préparation selon clone lié/complet.'],'Une décision argumentée.')],validate:['Deux clones démarrent sans collision.','Le retour à l’état initial est testé et chronométré.']});break;
 case 'H05':add({mission:'Préparer une appliance propre, exportable et importable sur un autre poste.',know:[k('OVA vs OVF','OVA = archive unique ; OVF = description + fichiers associés. Le choix dépend surtout de la facilité de distribution et d’inspection.','blue'),k('Nettoyage avant diffusion','Retirez données personnelles, mots de passe réels, clés privées, historique inutile et fichiers temporaires. Utilisez des identifiants de Lab dédiés et documentés.','red')],steps:[st('Auditer la VM source',['Listez comptes, clés, données, logiciels et paramètres réseau.','Supprimez tout secret ou donnée personnelle.'],'Une check-list de nettoyage signée.'),st('Arrêter et consolider',['Éteignez proprement la VM.','Assurez-vous que l’état à exporter est celui voulu.','Évitez d’exporter en pensant transférer la chaîne de snapshots.'],'État source clair et stable.','L’export OVF/OVA transporte l’état courant de l’appliance, pas l’historique complet des snapshots.','orange'),st('Exporter',['Exportez en OVA ou OVF.','Ajoutez version, date, taille et empreinte SHA-256 du fichier distribué.'],'Un paquet versionné.'),st('Tester sur un autre catalogue',['Importez sous un autre nom.','Contrôlez CPU, RAM, réseau, MAC et démarrage.'],'L’appliance fonctionne indépendamment de la VM source.')],validate:['L’archive ne contient aucun secret réel.','L’empreinte du fichier est enregistrée.','Une réimportation complète a été testée.'],sources:['vboxvm','vmware']});break;
 case 'H06':add({mission:'Diagnostiquer trois pannes d’hyperviseur sans appliquer de “solution magique”.',know:[k('Méthode','Symptôme → hypothèses → test le moins intrusif → résultat → correction → preuve. Ne changez qu’une variable à la fois.','green'),k('Causes fréquentes','Virtualisation matérielle indisponible, manque de RAM/disque, fichier VM déplacé, droits, conflit de réseau, média ISO absent ou configuration importée incompatible.','orange')],steps:[st('Panne 1 : la VM ne démarre pas',['Lisez le message exact.','Contrôlez ressources et virtualisation matérielle.','Documentez l’hypothèse avant correction.'],'Cause identifiée avec preuve.'),st('Panne 2 : la VM démarre sans réseau',['Vérifiez vNIC, mode réseau, adresse IP, route et DNS.','Testez du plus proche au plus lointain.'],'Point de rupture localisé.'),st('Panne 3 : VM importée incohérente',['Contrôlez firmware, disque, contrôleur, RAM et carte réseau.'],'Paramètre incompatible identifié.'),st('Rédiger la fiche dépannage',['Pour chaque panne : symptôme, test, cause, correction, preuve.'],'Une fiche réutilisable avec des élèves.')],validate:['Trois pannes sont résolues avec une démarche traçable.','Vous pouvez montrer la preuve qui valide chaque cause.']});break;
 case 'W01':add({mission:'Identifier l’architecture VMware Workstation et les fichiers indispensables d’une VM.',know:[k('.vmx et .vmdk','.vmx contient la configuration de la VM ; .vmdk correspond au disque virtuel ou à sa description selon le type de disque. D’autres fichiers peuvent apparaître pour logs, snapshots et état.','brown'),k('Hyperviseur de poste','VMware Workstation s’utilise sur un OS hôte et fournit VM, réseaux virtuels, snapshots et outils invités.','blue')],steps:[st('Créer une VM vide',['Créez une VM sans installer d’OS.','Repérez son dossier sur le disque.'],'Le dossier est identifié.'),st('Associer fichier et rôle',['Repérez .vmx, .vmdk, logs et éventuels fichiers temporaires.','Ouvrez .vmx en lecture seule pour observer quelques paramètres.'],'Une table fichier → rôle.'),st('Modifier via l’interface',['Changez la RAM depuis VMware, puis observez la modification correspondante après fermeture de l’interface.'],'Lien entre GUI et configuration compris.')],validate:['Vous savez quels fichiers sauvegarder/déplacer avec prudence.','Vous expliquez ce qui appartient à l’hôte et ce qui appartient à la VM.']});break;
 case 'W02':add({mission:'Créer une VM VMware Debian propre avec ressources, réseau et VMware Tools contrôlés.',know:[k('VMware Tools','Les outils invités améliorent pilotes et intégration. Leur présence ne remplace pas la configuration réseau ou les mises à jour du système invité.','green')],steps:[st('Définir la fiche technique',['Nom, vCPU, RAM, disque, firmware, réseau et ISO.'],'Fiche prête avant création.'),st('Créer la VM',['Utilisez l’assistant VMware et vérifiez chaque paramètre avant démarrage.'],'La VM démarre sur l’ISO.'),st('Installer et intégrer',['Installez Debian.','Installez/open-vm-tools selon le système et vérifiez son état.'],'La VM remonte correctement les fonctions d’intégration.'),st('Créer ETAT-BASE',['Contrôlez réseau et mises à jour puis prenez un snapshot.'],'Base réutilisable.')],validate:['La fiche correspond réellement aux paramètres VMware.','La VM démarre, communique et l’intégration invitée est vérifiée.']});break;
 case 'W03':add({mission:'Construire et comparer trois réseaux VMware : NAT, Bridged et Host-Only.',know:[k('NAT','La VM utilise un réseau privé derrière l’hôte pour sortir. Elle n’est pas, par défaut, équivalente à une nouvelle machine directement présente sur le LAN physique.','blue'),k('Bridged','La carte virtuelle est pontée vers une interface physique. La VM se comporte alors comme une machine du réseau relié : à utiliser uniquement sur un réseau autorisé.','red'),k('Host-Only / VMnet','Host-Only crée un réseau privé entre hôte et VM. Les VMnet permettent de construire plusieurs segments virtuels selon la configuration de Workstation.','green')],steps:[st('Mode NAT',['Placez la VM en NAT.','Relevez IP, passerelle, DNS, accès Internet et visibilité depuis le LAN.'],'Une ligne de matrice NAT.'),st('Mode Host-Only',['Passez sur un VMnet Host-Only.','Testez VM→hôte et VM→VM.','Vérifiez l’absence d’accès direct au LAN si aucune route supplémentaire n’est configurée.'],'Une ligne de matrice Host-Only.'),st('Mode Bridged sur réseau de Lab',['Uniquement sur interface/réseau autorisé, passez en Bridged.','Relevez l’adresse obtenue et comparez au LAN physique.'],'Une ligne de matrice Bridged.','En établissement, évitez de ponter une VM sur le réseau de production sans validation. Pour la démonstration, préférez une deuxième carte et un switch autonome.','red'),st('Construire la matrice',['Colonnes : VM→VM, VM→hôte, VM→Internet, LAN→VM.','Complétez pour les trois modes.'],'Une matrice de connectivité vérifiée par tests.')],validate:['La matrice est basée sur des tests et non sur des suppositions.','Vous savez choisir le mode pour un Lab isolé, un accès Internet ou un réseau physique autonome.'],sources:['itvmware','vmware']});break;
 case 'W04':add({mission:'Préparer un workflow VMware de snapshot, panne, restauration et clone pour un binôme.',know:[k('Snapshot ≠ sauvegarde','Un snapshot facilite le retour en arrière mais dépend du stockage et de la chaîne VMware. Gardez les chaînes courtes et maîtrisées.','orange')],steps:[st('Créer le point propre',['Snapshot ETAT-PROPRE avec description de ce qui fonctionne.'],'Un état documenté.'),st('Provoquer une panne',['Modifiez un service ou une configuration prévue.','Constatez et capturez le symptôme.'],'Panne reproductible.'),st('Restaurer',['Revenez à ETAT-PROPRE et vérifiez le service.'],'Retour validé.'),st('Cloner',['Créez une copie pour un autre binôme et contrôlez identité réseau.'],'Clone fonctionnel.')],validate:['Le retour arrière est démontré.','Le clone n’entre pas en conflit avec la VM source.']});break;
 case 'W05':add({mission:'Exporter une VM VMware en OVF/OVA, puis la réimporter et vérifier les paramètres qui peuvent changer.',know:[k('OVF/OVA','OVF décrit l’appliance et ses disques ; OVA regroupe le paquet en une archive. Après import, inspectez surtout réseau, firmware, contrôleurs et outils invités.','blue')],steps:[st('Préparer la VM',['Éteignez-la et retirez secrets/données inutiles.','Notez ses paramètres avant export.'],'Fiche “avant”.'),st('Exporter',['Utilisez l’export OVF/OVA disponible dans votre version.','Versionnez le fichier et calculez une empreinte.'],'Paquet exporté.'),st('Réimporter sous un autre nom',['Contrôlez les paramètres proposés avant validation.','Démarrez et testez le réseau.'],'Fiche “après”.'),st('Comparer',['Listez les paramètres conservés, adaptés ou régénérés.'],'Table de compatibilité.')],validate:['L’export a été réimporté avec succès.','La comparaison avant/après identifie au moins réseau, disque et firmware.'],sources:['vmware','vboxvm']});break;
 case 'W06':add({mission:'Migrer une VM VMware vers VirtualBox puis préparer le chemin inverse en privilégiant OVF/OVA.',know:[k('Méthode recommandée','Quand les deux produits le permettent, échangez une appliance OVF/OVA plutôt que de déplacer arbitrairement des fichiers internes de VM.','green'),k('Ce qui ne migre pas proprement','Snapshots, TPM virtuel, chiffrement et fonctions spécifiques à l’hyperviseur peuvent nécessiter un traitement particulier. Travaillez sur une copie arrêtée.','orange')],steps:[st('Créer une copie de sécurité',['Éteignez la VM et dupliquez le dossier source.'],'Source préservée.'),st('Exporter depuis VMware',['Exportez OVF/OVA et notez les paramètres matériels.'],'Appliance de migration.'),st('Importer dans VirtualBox',['Importez, contrôlez RAM/CPU/réseau/disque.','Démarrez et installez les outils invités adaptés si nécessaire.'],'VM fonctionnelle dans VirtualBox.'),st('Tester le chemin inverse',['Sur une petite VM de test, exportez depuis VirtualBox puis importez dans VMware.'],'Table des adaptations nécessaires.')],validate:['La VM migrée démarre et possède le réseau prévu.','Vous savez citer les éléments à contrôler après migration.'],sources:['vboxvm','vmware']});break;
 case 'D01':add({mission:'Déployer Nginx depuis une image et distinguer clairement image, conteneur et registre.',know:[k('Image','Modèle immuable composé de couches. Elle peut être téléchargée depuis un registre.','brown'),k('Conteneur','Instance d’exécution créée à partir d’une image. Supprimer le conteneur ne supprime pas automatiquement l’image.','green'),k('Registre','Service de distribution d’images. Docker Hub est un registre public courant, mais l’origine et la version d’une image doivent être contrôlées.','orange')],steps:[st('Télécharger une image',['Exécutez : docker pull nginx:stable','Listez les images locales.'],'nginx:stable apparaît localement.'),st('Créer le conteneur',['docker run --name web -d -p 127.0.0.1:8080:80 nginx:stable','Ouvrez http://localhost:8080.'],'La page Nginx répond.'),st('Observer la relation',['docker ps','docker inspect web','docker image ls','Repérez le nom d’image utilisé par le conteneur.'],'Vous pouvez relier conteneur → image.'),st('Supprimer sans perdre l’image',['docker rm -f web','Vérifiez que l’image nginx:stable reste locale.'],'Image et conteneur ne sont plus confondus.')],validate:['Nginx répond sur le port choisi.','Vous savez montrer dans les commandes la différence image/conteneur.'],sources:['docker']});break;
 case 'D02':add({mission:'Comprendre tags et digest pour rendre un Lab Docker reproductible.',know:[k('Tag','Étiquette lisible attachée à une image. “latest” n’est pas une garantie de stabilité ni une version figée.','orange'),k('Digest','Identifiant cryptographique du contenu publié. Il permet de cibler précisément un contenu d’image.','blue')],steps:[st('Comparer deux références',['docker pull nginx:stable','docker image inspect nginx:stable','Relevez RepoTags et RepoDigests.'],'Tag et digest identifiés.'),st('Documenter le Lab',['Écrivez la référence d’image utilisée et la date.','Expliquez ce qui peut changer si seul un tag flottant est utilisé.'],'Fiche de version.'),st('Préparer le hors-ligne',['Vérifiez que toutes les images nécessaires sont présentes avant la séance.'],'Liste d’images maîtrisée.')],validate:['Vous différenciez nom, tag et digest sur un exemple réel.','Votre fiche permet de savoir quelle image a été utilisée.']});break;
 case 'D03':add({mission:'Observer les couches d’une image et la couche inscriptible d’un conteneur.',know:[k('Copy-on-write','Les couches d’image restent immuables. Le conteneur écrit ses changements dans une couche supplémentaire.','brown'),k('Conséquence','Une donnée écrite uniquement dans la couche du conteneur disparaît avec lui. Pour une donnée métier, utilisez un volume ou un stockage prévu.','orange')],steps:[st('Observer l’historique',['docker image history nginx:stable','Repérez plusieurs couches/instructions.'],'Historique commenté.'),st('Créer une modification de conteneur',['Lancez un conteneur Alpine/Ubuntu.','Créez un fichier dans le système de fichiers du conteneur.','Utilisez docker diff.'],'La modification apparaît comme changement du conteneur.'),st('Supprimer et recréer',['Supprimez le conteneur puis recréez-en un depuis la même image.','Cherchez le fichier.'],'Le fichier n’est plus présent.'),st('Conclure sur la persistance',['Indiquez ce qui devrait être déplacé vers un volume.'],'Décision de stockage correcte.')],validate:['Vous expliquez où se trouve la modification et pourquoi elle disparaît.','Vous savez quand utiliser un volume.']});break;
 case 'D04':add({mission:'Construire une image Web CIEL avec un Dockerfile simple et reproductible.',know:[k('Dockerfile','Recette de construction : FROM choisit la base, COPY ajoute des fichiers, RUN exécute lors du build, CMD définit le démarrage par défaut.','brown'),k('Cache et ordre','L’ordre des instructions influence la réutilisation du cache et la taille/rapidité de construction.','blue'),k('Secrets','Ne copiez jamais de mots de passe, tokens ou clés privées dans l’image. Ils peuvent rester accessibles dans l’historique ou les couches.','red')],steps:[st('Créer le projet',['Créez un dossier ciel-web.','Ajoutez index.html avec votre nom de Lab.'],'Dossier minimal.'),st('Écrire Dockerfile',['FROM nginx:stable-alpine','COPY index.html /usr/share/nginx/html/index.html'],'Dockerfile de deux instructions.'),st('Construire',['docker build -t ciel-web:1.0 .','docker image history ciel-web:1.0'],'Image construite et historique visible.'),st('Tester',['docker run --rm -d --name ciel-web -p 127.0.0.1:8080:80 ciel-web:1.0','Ouvrez la page puis arrêtez le conteneur.'],'Page personnalisée accessible.')],validate:['L’image est reconstruite à partir du Dockerfile et du dossier projet.','Aucun secret n’est intégré au build.'],sources:['dbuild','docker']});break;
 case 'D05':add({mission:'Préparer un kit Docker hors ligne et comprendre save/load par rapport à export/import.',know:[k('save / load','Conserve des images avec leurs couches et métadonnées pour les transporter entre moteurs Docker.','green'),k('export / import','Travaille sur le système de fichiers d’un conteneur et n’est pas l’équivalent d’une sauvegarde d’image complète. Pour distribuer un Lab, préférez généralement save/load ou un registre.','orange')],steps:[st('Créer l’archive',['docker image save -o images-docker.tar nginx:stable','Calculez l’empreinte SHA-256 du fichier.'],'Archive + empreinte.'),st('Simuler le poste hors ligne',['Supprimez localement l’image nginx:stable après vous être assuré qu’elle est dans l’archive.'],'Image absente localement.'),st('Recharger',['docker image load -i images-docker.tar','Vérifiez le tag et relancez Nginx.'],'Service redéployé sans pull.'),st('Comparer avec export/import',['Expliquez sur une fiche pourquoi export/import n’est pas choisi pour ce kit.'],'Choix de méthode argumenté.')],validate:['L’image est restaurée depuis le TAR et fonctionne.','L’empreinte du kit est enregistrée.']});break;
 case 'D06':add({mission:'Démontrer que les données d’un volume survivent à la suppression d’un conteneur.',know:[k('Volume','Stockage géré par le moteur et séparé du cycle de vie du conteneur.','green'),k('Bind mount','Monte un chemin de l’hôte dans le conteneur. Utile mais plus dépendant de l’organisation et des droits de l’hôte.','blue')],steps:[st('Créer un volume',['docker volume create data-ciel','docker volume inspect data-ciel'],'Volume identifié.'),st('Écrire une donnée',['docker run --rm -v data-ciel:/data alpine sh -c "echo CIEL > /data/test.txt"'],'Donnée créée.'),st('Relire dans un autre conteneur',['docker run --rm -v data-ciel:/data alpine cat /data/test.txt'],'CIEL est affiché.'),st('Identifier le cycle de vie',['Listez ce qui peut être supprimé sans perdre la donnée et ce qui supprimerait réellement le volume.'],'Cycle de vie compris.')],validate:['La donnée est relue depuis un nouveau conteneur.','Vous différenciez stockage du conteneur et volume.'],sources:['dvol','docker']});break;
 case 'D07':add({mission:'Sauvegarder un volume, le supprimer, puis restaurer ses données et vérifier le résultat.',know:[k('Sauvegarde testée','Une archive n’est pas une preuve de sauvegarde tant qu’une restauration n’a pas été testée.','orange')],steps:[st('Créer des données connues',['Placez plusieurs fichiers dans un volume et calculez éventuellement une empreinte sur un fichier témoin.'],'Jeu de données de référence.'),st('Sauvegarder',['Utilisez un conteneur temporaire pour créer une archive tar du volume vers un dossier de sauvegarde de l’hôte.'],'Archive présente et lisible.'),st('Supprimer / recréer',['Supprimez le volume après contrôle de l’archive.','Recréez un volume vide.'],'Situation de perte simulée.'),st('Restaurer et vérifier',['Extrayez l’archive dans le nouveau volume.','Relisez les fichiers et comparez l’empreinte témoin.'],'Données restaurées identiques.')],validate:['La restauration a été faite dans un volume recréé.','Une preuve permet de comparer avant/après.'],sources:['dvol','docker']});break;
 case 'D08':add({mission:'Construire un réseau Docker et publier uniquement le port nécessaire.',know:[k('Réseau utilisateur','Sur un réseau Docker utilisateur, les conteneurs peuvent se joindre par nom grâce au DNS interne.','blue'),k('Publier un port','-p HOTE:CONTENEUR rend un port accessible depuis l’hôte selon l’adresse d’écoute. EXPOSE dans une image n’est pas à lui seul une publication vers l’extérieur.','orange')],steps:[st('Créer le réseau',['docker network create cielnet','docker network inspect cielnet'],'Réseau créé.'),st('Lancer Nginx',['docker run -d --name web --network cielnet -p 127.0.0.1:8080:80 nginx:stable'],'Service accessible localement.'),st('Tester le DNS interne',['docker run --rm --network cielnet alpine getent hosts web'],'Le nom web est résolu.'),st('Vérifier l’exposition',['Contrôlez docker ps et l’adresse de publication.','Expliquez la différence entre 127.0.0.1:8080 et 0.0.0.0:8080.'],'Port maîtrisé.')],validate:['Le service est joignable comme prévu et seulement sur l’interface choisie.','Le nom de service est résolu sur le réseau Docker.'],sources:['dnet','docker']});break;
 case 'D09':add({mission:'Décrire un mini-Lab multi-service dans Compose, le supprimer puis le recréer uniquement à partir du dossier projet.',know:[k('Compose','Un fichier compose.yaml décrit les services, réseaux, volumes et paramètres. Il devient une excellente ressource versionnable pour une classe.','green'),k('Cycle de vie','docker compose up crée/démarre ; down arrête et supprime les ressources du projet selon les options. Les volumes nommés ne doivent pas être supprimés par inadvertance.','orange')],steps:[st('Créer le dossier projet',['Créez compose-lab/ avec compose.yaml et un README court.'],'Dossier portable.'),st('Définir deux services',['Ajoutez un service web Nginx et un second service de test ou supervision.','Déclarez réseau et volume si nécessaires.'],'YAML valide.'),st('Valider avant lancer',['docker compose config','Corrigez toute erreur YAML.'],'Configuration normalisée sans erreur.'),st('Déployer / supprimer / redéployer',['docker compose up -d','docker compose ps','docker compose down','docker compose up -d'],'Le Lab revient à l’identique depuis les fichiers.')],validate:['Le projet se recrée depuis son seul dossier.','Vous savez identifier dans YAML services, ports, réseau et volume.'],sources:['compose','dnet','dvol']});break;
 case 'D10':add({mission:'Diagnostiquer un conteneur en échec et corriger le problème sans ajouter des privilèges inutiles.',know:[k('Ordre de diagnostic','docker ps -a → logs → inspect → stats → exec. Commencez par observer avant de recréer ou modifier.','green'),k('Daemon privilégié','L’accès au socket Docker ou --privileged donne des capacités très élevées. Ne l’utilisez pas comme solution de dépannage générique.','red')],steps:[st('Observer l’état',['docker ps -a','Repérez Exit code, Restarting ou Health.'],'Symptôme précis.'),st('Lire les logs',['docker logs <conteneur>','Relevez la première erreur utile, pas seulement la dernière ligne.'],'Message d’erreur cité.'),st('Inspecter la configuration',['docker inspect <conteneur>','Contrôlez commande, montages, variables, ports et réseau.'],'Hypothèse formulée.'),st('Corriger et prouver',['Corrigez uniquement la cause identifiée.','Relancez puis vérifiez logs et service.'],'Correction minimale et preuve de fonctionnement.')],validate:['La cause est reliée à un test précis.','La correction n’utilise pas --privileged ou le socket Docker sans nécessité démontrée.']});break;
 case 'D11':add({mission:'Segmenter un mini-Lab Docker en réseau front et back, avec résolution DNS par nom.',know:[k('DNS Docker','Les conteneurs d’un réseau utilisateur se découvrent par nom de service/conteneur. On évite donc de coder des IP fixes quand ce n’est pas nécessaire.','blue'),k('Segmentation','Un service peut rejoindre plusieurs réseaux ; une base peut rester uniquement sur le back et ne pas publier de port vers l’hôte.','green')],steps:[st('Créer deux réseaux',['docker network create ciel-front','docker network create ciel-back'],'Deux segments présents.'),st('Positionner les services',['Lancez web sur ciel-front.','Connectez web à ciel-back si le scénario l’exige.','Placez un service “db” uniquement sur ciel-back sans port publié.'],'Architecture segmentée.'),st('Tester la résolution',['Depuis un conteneur du même réseau, résolvez web/db par nom.','Depuis un réseau qui ne contient pas le service, observez la différence.'],'Table de visibilité.'),st('Dessiner le Lab',['Représentez les réseaux et les interfaces de chaque conteneur.'],'Schéma fidèle à docker network inspect.')],validate:['Le service back n’est pas publié inutilement.','Le schéma et les tests montrent qui peut joindre qui.'],sources:['dnet','docker']});break;
 case 'D12':add({mission:'Écrire un compose.yaml lisible à plusieurs services, réseaux et volumes, puis le valider avec Docker Compose.',know:[k('YAML','L’indentation a un sens. Utilisez docker compose config avant de lancer pour détecter de nombreuses erreurs de structure.','orange'),k('depends_on','depends_on gère un ordre de démarrage mais ne garantit pas à lui seul que l’application dépendante est prête. Pour cela, pensez healthcheck/attente applicative.','blue')],steps:[st('Écrire services',['Déclarez web et un second service.','Utilisez une image versionnée.'],'Section services lisible.'),st('Ajouter réseau et volume',['Déclarez un réseau interne de Lab et un volume persistant.','Attachez seulement les services qui en ont besoin.'],'Architecture explicitée dans YAML.'),st('Valider',['docker compose config','Corrigez les erreurs avant déploiement.'],'Aucune erreur de configuration.'),st('Tester le cycle',['up -d, ps, logs, down, up -d.'],'Lab reproductible.')],validate:['Le YAML se valide et recrée le Lab.','Les ports, réseaux et volumes correspondent au schéma.'],sources:['compose','dnet','dvol']});break;
 case 'D13':add({mission:'Installer Portainer CE pour visualiser un hôte Docker, puis retrouver conteneurs, images, réseaux et volumes.',know:[k('Portainer','Interface d’administration Docker : très utile pédagogiquement pour visualiser les objets manipulés en CLI.','green'),k('Socket Docker','Monter /var/run/docker.sock donne à Portainer un pouvoir administratif très élevé sur l’hôte. Ce montage ne doit pas être accordé à des conteneurs non maîtrisés.','red')],steps:[st('Préparer la persistance',['docker volume create portainer_data'],'Volume créé.'),st('Lancer Portainer',['docker run -d --name portainer --restart=always -p 9443:9443 -v /var/run/docker.sock:/var/run/docker.sock -v portainer_data:/data portainer/portainer-ce:lts'],'Conteneur actif.'),st('Initialiser',['Ouvrez https://IP:9443.','Créez le compte admin de Lab selon la politique de la formation.','Sélectionnez l’environnement local.'],'Tableau de bord accessible.'),st('Faire le lien GUI / CLI',['Dans Portainer, retrouvez un conteneur Nginx, son image, son réseau et son volume éventuel.','Comparez avec docker ps/network/volume ls.'],'Correspondance objets GUI/CLI.')],validate:['Vous retrouvez dans Portainer les mêmes objets qu’en ligne de commande.','Vous pouvez expliquer pourquoi le socket Docker est sensible.'],sources:['portainer','docker']});break;
 case 'D14':add({mission:'Superviser un service Web avec Uptime Kuma, provoquer une coupure et observer l’incident puis le retour à la normale.',know:[k('Supervision externe','Un moniteur HTTP vérifie le service comme le ferait un client. Un healthcheck Docker vérifie plutôt l’état déclaré à l’intérieur de la logique du conteneur. Les deux sont complémentaires.','blue'),k('Persistance','L’historique et la configuration de supervision doivent être conservés dans un volume ou chemin persistant.','green')],steps:[st('Déployer Uptime Kuma',['Créez un volume.','Lancez louislam/uptime-kuma:2 sur le port 3001 selon le réseau de Lab.'],'Interface accessible.'),st('Créer un moniteur',['Surveillez le service Nginx du Lab.','Choisissez un intervalle adapté à la démonstration.'],'État UP visible.'),st('Provoquer la panne',['Arrêtez Nginx volontairement.','Attendez la détection puis relevez l’heure.'],'État DOWN enregistré.'),st('Rétablir',['Redémarrez Nginx.','Vérifiez le retour UP et l’historique.'],'Cycle incident/rétablissement visible.')],validate:['La coupure est détectée et datée.','Le retour à la normale est visible dans l’historique.'],sources:['kuma','itkuma']});break;
 case 'D15':add({mission:'Construire la mini-infrastructure Docker finale : Nginx, Portainer et Uptime Kuma avec réseaux, volumes et supervision.',know:[k('Séparer les rôles','Nginx = service applicatif ; Portainer = administration ; Uptime Kuma = supervision. Les droits et l’exposition réseau ne doivent pas être identiques.','blue'),k('Principe de moindre exposition','Seul le service utile doit être publié. Le socket Docker n’est monté que dans Portainer ; Uptime Kuma et Nginx n’en ont pas besoin.','red')],steps:[st('Dessiner avant de coder',['Schéma : hôte Docker, réseau monitoring, web, portainer, uptime-kuma, volumes.','Indiquez quels ports doivent être accessibles depuis le poste.'],'Architecture validée avant YAML.'),st('Écrire compose.yaml',['Déclarez les trois services.','Ajoutez volumes Portainer/Kuma.','Ajoutez réseau commun uniquement là où nécessaire.','Ne montez le socket Docker que dans Portainer.'],'YAML lisible et commenté.'),st('Valider et déployer',['docker compose config','docker compose up -d','docker compose ps'],'Trois services démarrés.'),st('Configurer la supervision',['Dans Uptime Kuma, surveillez Nginx par son nom de service Docker si les deux sont sur le même réseau.'],'Moniteur UP sans IP fixe.'),st('Tester la panne',['Arrêtez uniquement web.','Observez Kuma et Portainer.','Redémarrez web.'],'Panne détectée puis rétablie.'),st('Tester la persistance',['Recréez les conteneurs sans supprimer les volumes.','Vérifiez que Portainer/Kuma conservent leur configuration.'],'Persistance démontrée.')],validate:['Les trois rôles sont visibles sur le schéma et dans Compose.','Kuma détecte la panne de Nginx.','Les données d’administration/supervision persistent après recréation.'],sources:['compose','portainer','kuma','itkuma']});break;
 case 'P01':add({mission:'Identifier ce que Proxmox VE apporte comme plateforme de Lab : KVM pour les VM, LXC pour les conteneurs système, réseau, stockage et administration Web.',know:[k('KVM et LXC','Proxmox VE intègre KVM pour les machines virtuelles et LXC pour les conteneurs système. Ils n’ont pas le même niveau d’isolation ni les mêmes usages.','brown'),k('Plateforme serveur','L’intérêt pédagogique vient de la centralisation : plusieurs groupes peuvent accéder à des ressources sur un serveur sans installer un hyperviseur sur chaque poste.','blue')],steps:[st('Explorer l’interface',['Repérez Datacenter, nœud, stockages, réseau et liste des VM/CT.'],'Carte mentale de l’interface.'),st('Associer les objets',['Pour VM, CT, stockage, bridge, template et backup, écrivez le rôle.'],'Glossaire Proxmox.'),st('Choisir KVM ou LXC',['Windows Server, Debian complet, petit service Linux, routeur virtuel : choisissez VM ou CT et justifiez.'],'Quatre décisions argumentées.')],validate:['Vous savez expliquer pourquoi Windows Server se déploie ici en VM.','Vous identifiez le rôle de vmbr0, storage, VM et CT.'],sources:['proxmox','itpve']});break;
 case 'P02':add({mission:'Installer Proxmox VE sur une machine physique de Lab en sécurisant le choix du disque et l’accès d’administration.',know:[k('Attention destructive','L’installation de Proxmox sur la machine dédiée repartitionne/écrase le disque sélectionné. Vérifiez deux fois la cible et ne faites pas cette activité sur un poste contenant des données à conserver.','red'),k('Administration','Après installation, l’interface Web est généralement accessible en HTTPS sur le port 8006 de l’adresse de management configurée.','blue')],steps:[st('Préparer la machine',['Inventoriez CPU, RAM, interfaces réseau et disques.','Identifiez physiquement le disque qui sera utilisé.','Débranchez si possible les disques non nécessaires pour éviter une erreur.'],'Fiche matériel + disque cible validé.'),st('Installer',['Démarrez sur l’ISO Proxmox.','Sélectionnez le disque dédié.','Configurez pays/clavier, mot de passe de Lab et adresse de management prévue.'],'Installation terminée.'),st('Premier accès',['Depuis un poste du réseau de Lab, ouvrez https://IP:8006.','Acceptez uniquement l’avertissement certificat attendu du Lab.','Connectez-vous et repérez le nœud.'],'Interface accessible.'),st('Contrôles post-install',['Relevez version, IP, gateway, DNS, stockage local et interfaces réseau.'],'Fiche d’état initial.'),st('Créer un plan de retour',['Documentez comment réinstaller ou restaurer la plateforme de Lab si la configuration est perdue.'],'Plan B écrit.')],validate:['Le bon disque a été utilisé et le serveur est administrable depuis le réseau de Lab.','La fiche contient IP, passerelle, DNS, interfaces et stockage.'],sources:['proxmox','itpve']});break;
 case 'P03':add({mission:'Comprendre vmbr0 comme commutateur virtuel et créer un second bridge isolé pour un Lab.',know:[k('vmbrX','Un bridge Linux Proxmox fonctionne comme un switch virtuel auquel les interfaces des invités sont raccordées. Un bridge peut être relié à une carte physique ou rester interne.','blue'),k('Risque de coupure','Une mauvaise modification du réseau de management peut rendre le nœud inaccessible. Travaillez avec console locale disponible et modifiez une chose à la fois.','red')],steps:[st('Lire la configuration',['Dans Système → Réseau, repérez la NIC physique et vmbr0.','Dessinez : VM → vNIC → vmbr0 → NIC physique → switch.'],'Schéma du chemin réseau.'),st('Créer un bridge isolé',['Ajoutez vmbr1 sans bridge-port physique pour le Lab interne.','N’ajoutez pas de gateway supplémentaire.'],'vmbr1 créé.'),st('Connecter deux VM',['Branchez leurs vNIC sur vmbr1.','Configurez deux IP du même sous-réseau et testez ping.'],'Communication VM↔VM.'),st('Comparer vmbr0/vmbr1',['Expliquez lequel mène au réseau physique et lequel reste isolé.'],'Table de connectivité.')],validate:['Deux VM communiquent sur le bridge isolé.','Vous savez tracer le chemin du paquet pour vmbr0 et vmbr1.'],sources:['pvenet','proxmox','itpve']});break;
 case 'P04':add({mission:'Organiser le stockage Proxmox pour distinguer ISO, disques VM, templates et sauvegardes.',know:[k('Types de contenu','Un stockage Proxmox peut accepter certains types de contenu : ISO, images disque, sauvegardes, templates de conteneurs, etc. Tous les stockages ne servent pas à tout.','brown')],steps:[st('Inventorier',['Ouvrez Datacenter → Storage.','Pour chaque stockage, relevez type, capacité et contenus autorisés.'],'Table des stockages.'),st('Ajouter une ISO',['Téléversez une ISO sur un stockage qui accepte ISO.','Vérifiez taille et nom.'],'ISO disponible pour une VM.'),st('Créer un petit disque VM',['Créez/attachez un disque virtuel au stockage prévu.','Relevez format et taille.'],'Disque localisé.'),st('Planifier les sauvegardes',['Choisissez où seront stockés les backups et vérifiez l’espace disponible.'],'Plan de capacité simple.')],validate:['Vous savez où placer ISO, disque VM et sauvegarde.','Le plan évite de saturer le stockage de management.'],sources:['proxmox']});break;
 case 'P05':add({mission:'Créer une VM KVM et un conteneur LXC, puis comparer ressources, démarrage et usages.',know:[k('VM KVM','Virtualise une machine complète avec son propre noyau invité.','brown'),k('LXC','Conteneur système Linux partageant le noyau de l’hôte. Plus léger, mais différent d’une VM complète.','green')],steps:[st('Créer la VM',['Créez une VM Debian depuis ISO.','Définissez CPU, RAM, disque et bridge.'],'VM démarrable.'),st('Créer le CT',['Téléchargez/choisissez un template LXC adapté.','Créez le CT avec ressources et réseau.'],'CT démarrable.'),st('Comparer',['Mesurez temps de démarrage et RAM affichée.','Listez différences d’OS/noyau et isolation.'],'Table VM vs CT.'),st('Choisir pour trois services',['Windows Server, Nginx Linux, routeur virtuel : choisissez VM/CT.'],'Décisions argumentées.')],validate:['VM et CT fonctionnent sur le réseau prévu.','Vous expliquez la différence de noyau/isolation.']});break;
 case 'P06':add({mission:'Transformer une VM propre en modèle puis déployer rapidement plusieurs instances cohérentes.',know:[k('Template','Un template est une base destinée au clonage. On ne l’utilise pas comme une VM de travail quotidienne.','green'),k('Cloud-Init','Cloud-Init peut injecter nom, utilisateur, clé SSH et réseau au premier démarrage des images compatibles, ce qui automatise fortement un Lab.','blue')],steps:[st('Préparer la VM modèle',['Installez et mettez à jour Debian.','Nettoyez données uniques inutiles et arrêtez proprement.'],'VM propre.'),st('Convertir en template',['Convertissez selon la procédure Proxmox.','Vérifiez qu’il apparaît comme modèle.'],'Template prêt.'),st('Cloner deux instances',['Créez LAB-01 et LAB-02.','Adaptez identité/réseau.'],'Deux instances distinctes.'),st('Option Cloud-Init',['Sur une image compatible, configurez utilisateur et réseau via Cloud-Init.','Démarrez et vérifiez les paramètres injectés.'],'Personnalisation automatisée.')],validate:['Deux clones sont créés sans collision réseau.','Vous expliquez ce que Cloud-Init automatise et ce qu’il ne remplace pas.'],sources:['proxmox','itpve']});break;
 case 'P07':add({mission:'Sauvegarder une VM Proxmox, la supprimer dans le Lab, puis la restaurer sous contrôle.',know:[k('Backup vs snapshot','Le backup Proxmox produit une sauvegarde restaurable sur un stockage prévu. Un snapshot reste lié au stockage/état de la VM.','orange')],steps:[st('Créer une donnée témoin',['Dans la VM, créez /root/preuve-lab.txt ou équivalent.'],'Preuve connue.'),st('Lancer un backup',['Dans Backup, choisissez stockage et mode adapté.','Attendez la fin et vérifiez le journal.'],'Backup terminé sans erreur.'),st('Simuler la perte',['Dans un Lab dédié, supprimez ou écartez la VM source après validation du backup.'],'Situation de restauration.'),st('Restaurer',['Restaurez sous un ID/nom maîtrisé.','Démarrez et vérifiez la donnée témoin et le réseau.'],'VM récupérée.')],validate:['Le backup a été restauré, pas seulement créé.','La donnée témoin et le service attendu sont présents.'],sources:['proxmox']});break;
 case 'P08':add({mission:'Créer un compte enseignant/participant à droits limités et appliquer une règle de pare-feu simple dans un Lab.',know:[k('RBAC','Proxmox gère utilisateurs, rôles et ACL. Donnez le minimum nécessaire sur le bon périmètre plutôt qu’un compte root partagé.','green'),k('Pare-feu','Le pare-feu peut s’appliquer à plusieurs niveaux. Une règle mal placée peut couper l’accès ; préparez une console de secours.','red')],steps:[st('Créer un utilisateur de Lab',['Créez un utilisateur non-root dans le realm prévu.'],'Compte distinct.'),st('Attribuer un rôle limité',['Donnez les droits uniquement sur un pool ou des VM de Lab.','Testez ce que le compte voit et peut faire.'],'Périmètre vérifié.'),st('Tester une règle firewall',['Sur une VM de test, autorisez le service nécessaire et bloquez un accès non requis.','Testez depuis un client.'],'Différence autorisé/bloqué observée.'),st('Documenter le secours',['Indiquez comment récupérer l’accès en cas de règle erronée.'],'Plan de récupération.')],validate:['Le compte limité ne possède pas de droits d’administration globale.','La règle firewall est validée par un test de connexion.'],sources:['proxmox','itpve']});break;
 case 'P09':add({mission:'Résoudre une panne Proxmox en séparant stockage, réseau, VM et hôte.',know:[k('Toujours localiser la couche','Demandez : le nœud est-il joignable ? le bridge est-il correct ? le stockage est-il disponible ? la VM démarre-t-elle ? le service invité répond-il ?','green')],steps:[st('Panne stockage',['Repérez un stockage plein/inaccessible simulé.','Lisez tâches et logs puis identifiez l’impact.'],'Cause de stockage prouvée.'),st('Panne réseau',['Contrôlez bridge, vNIC, VLAN éventuel, IP invité et route.'],'Point de rupture localisé.'),st('Panne VM',['Contrôlez état, console et logs de tâche.'],'Cause VM/OS distinguée d’une cause hôte.'),st('Fiche diagnostic',['Rédigez arbre de décision : hôte → stockage → réseau → VM → service.'],'Méthode réutilisable.')],validate:['Chaque panne est localisée dans la bonne couche.','La correction est validée par un test après modification.']});break;
 case 'N01':add({mission:'Tracer le chemin d’un paquet depuis une application dans une VM jusqu’à une autre VM ou au réseau physique.',know:[k('vNIC et switch virtuel','La VM voit une carte réseau virtuelle. Elle est reliée à un switch/bridge virtuel géré par l’hyperviseur, qui décide comment atteindre les autres interfaces.','blue')],steps:[st('Dessiner la pile',['Application → pile IP invitée → vNIC → switch virtuel → destination.'],'Schéma initial.'),st('Tester VM→VM',['Placez deux VM sur le même réseau virtuel.','Ping puis observez ARP/neighbor.'],'Communication locale.'),st('Tester vers l’extérieur',['Selon le mode autorisé, testez passerelle et Internet ou réseau physique.'],'Chemin étendu.'),st('Annoter le schéma',['Ajoutez IP et MAC aux points utiles.'],'Schéma technique complet.')],validate:['Vous pouvez dire à quel endroit intervient la vNIC, le switch virtuel et la NIC physique.','Les tests correspondent au schéma.']});break;
 case 'N02':add({mission:'Comparer NAT, bridge, interne et Host-Only à partir d’une matrice de tests.',know:[k('Ne pas apprendre les modes par cœur','Le plus efficace est de tester quatre destinations : autre VM, hôte, Internet, LAN physique. Les résultats montrent le comportement du mode.','green')],steps:[st('Préparer la matrice',['Lignes : NAT, bridge, interne, Host-Only.','Colonnes : VM↔VM, VM↔hôte, VM→Internet, LAN→VM.'],'Matrice vide.'),st('Tester deux modes isolés',['NAT puis interne/Host-Only selon l’hyperviseur.','Relevez IP/route/DNS.'],'Premières lignes vérifiées.'),st('Tester bridge uniquement sur Lab autorisé',['Utilisez une NIC/switch autonome si possible.','Observez DHCP et visibilité.'],'Ligne bridge vérifiée.'),st('Choisir pour trois besoins',['Internet sans présence directe sur LAN ; réseau totalement isolé ; lien vers switch de TP.'],'Trois choix argumentés.')],validate:['La matrice est complétée à partir de mesures.','Le mode bridge n’est pas utilisé sur le réseau établissement sans validation.'],sources:['vboxnet','itvbox','itvmware','hvnet']});break;
 case 'N03':add({mission:'Utiliser deux cartes réseau pour séparer un réseau de management/Internet et un réseau de Lab.',know:[k('Deux NIC = lisibilité, pas obligation absolue','Un seul adaptateur peut techniquement transporter plusieurs réseaux/VLAN selon l’architecture. Deux NIC physiques sont pédagogiquement utiles pour séparer clairement les rôles et limiter les erreurs de bridge.','blue')],steps:[st('Identifier les cartes',['Relevez nom/MAC de NIC1 et NIC2.','Décidez : NIC1 management/Internet ; NIC2 switch autonome de Lab.'],'Rôles écrits.'),st('Créer les liaisons virtuelles',['Associez le réseau externe/management à NIC1.','Associez le bridge du Lab physique à NIC2.'],'Séparation visible.'),st('Tester les chemins',['VM management : accès attendu.','VM Lab : accès au switch autonome seulement selon scénario.'],'Matrice de connectivité.'),st('Débrancher NIC2',['Observez l’impact sur le Lab et l’absence d’impact attendu sur le management.'],'Dépendance physique comprise.')],validate:['Chaque carte a un rôle documenté.','Les tests montrent que le réseau autonome ne dépend pas du LAN établissement.']});break;
 case 'N04':add({mission:'Relier une VM à un vrai switch autonome via un bridge et une carte réseau dédiée.',know:[k('Bridge vers NIC physique','Le bridge logiciel relie les vNIC des invités à une interface Ethernet physique. Le switch externe voit alors les MAC des machines virtuelles comme des équipements raccordés au réseau.','blue'),k('Toujours isoler la démonstration','Utilisez un switch autonome non relié au réseau de production de l’établissement, sauf autorisation explicite.','red')],steps:[st('Câbler le Lab',['NIC dédiée du serveur/poste → switch autonome.','Raccordez un PC ou équipement de test au même switch.'],'Topologie physique simple.'),st('Créer/choisir le bridge',['Associez le bridge à la NIC dédiée.','Branchez la vNIC de la VM sur ce bridge.'],'Lien virtuel↔physique.'),st('Configurer IP',['Donnez des IP statiques du même sous-réseau à la VM et au PC de test.'],'Adressage cohérent.'),st('Tester',['Ping, ARP, éventuellement service Web.','Débranchez le câble pour observer le changement.'],'Preuve de passage par le réseau physique.')],validate:['La VM communique avec l’équipement physique du switch autonome.','Le schéma distingue bridge, NIC physique et switch.']});break;
 case 'N05':add({mission:'Segmenter un Lab en VLAN et vérifier que les machines ne communiquent que si le trunk/routage le permet.',know:[k('VLAN','Un VLAN sépare logiquement des domaines de niveau 2 sur une même infrastructure. Le tag 802.1Q identifie le VLAN sur un lien trunk.','blue'),k('Pas de routage implicite','Deux VLAN distincts ne communiquent pas simplement parce qu’ils sont sur le même switch ; il faut un équipement ou service de routage inter-VLAN si on veut les relier.','orange')],steps:[st('Définir le plan',['VLAN 10 = postes, VLAN 20 = serveurs.','Choisissez deux sous-réseaux distincts.'],'Plan VLAN/IP.'),st('Configurer le switch/bridge de Lab',['Créez les VLAN sur l’équipement autonome ou la plateforme.','Définissez ports access et trunk selon le matériel disponible.'],'Segmentation configurée.'),st('Tester dans chaque VLAN',['Deux hôtes du même VLAN doivent communiquer.','Entre VLAN, observez l’échec en absence de routage.'],'Résultats attendus.'),st('Ajouter le routage si objectif',['Configurez routeur/L3 uniquement si la capsule prévoit l’inter-VLAN.','Retestez.'],'Différence L2/L3 observée.')],validate:['Vous prouvez l’isolation initiale entre VLAN.','Le schéma indique VLAN, ports access/trunk et sous-réseaux.']});break;
 case 'N06':add({mission:'Résoudre une panne réseau mystère en appliquant une méthode couche par couche.',know:[k('Ordre de test','Lien/vNIC → adresse IP → masque → passerelle → DNS → port/service. Tester une IP avant un nom permet de séparer réseau et DNS.','green')],steps:[st('Constater sans corriger',['Relevez ipconfig/ip addr, route, DNS et état de la carte.'],'État initial conservé.'),st('Tester local',['Ping loopback, IP locale, pair du même réseau.'],'Couche locale évaluée.'),st('Tester routage',['Ping passerelle puis IP distante si prévue.'],'Routage évalué.'),st('Tester DNS et service',['nslookup/dig puis connexion au port applicatif.'],'DNS séparé du service.'),st('Corriger une seule cause',['Appliquez la correction minimale et rejouez les tests.'],'Preuve avant/après.')],validate:['La cause est démontrée par un test qui échoue puis réussit.','La fiche distingue adresse, route, DNS et service.']});break;
 case 'A01':add({mission:'Comprendre pourquoi DNS est indispensable à Active Directory avant de créer le domaine ciel.lan.',know:[k('AD DS','Le domaine centralise identité, ordinateurs, groupes, politiques et annuaire.','brown'),k('DNS et AD','Les clients utilisent DNS pour localiser les contrôleurs de domaine et les services AD. Dans le Lab, le client doit donc utiliser DC01 comme DNS pour rejoindre correctement ciel.lan.','blue')],steps:[st('Dessiner le Lab',['DC01 192.168.10.10 ; PC01 192.168.10.21 ; réseau 192.168.10.0/24.','Indiquez DNS de PC01 = 192.168.10.10.'],'Schéma de base.'),st('Observer DNS avant domaine',['Sur DC01, relevez la configuration IP statique prévue.','Expliquez pourquoi une IP fixe est nécessaire dans le Lab.'],'Plan d’adressage.'),st('Comparer résolution Internet / AD',['Discutez : un DNS public connaît-il les enregistrements internes de ciel.lan ?','Déduisez le rôle du DNS AD.'],'Chaîne de résolution comprise.')],validate:['Vous expliquez pourquoi mettre 8.8.8.8 comme seul DNS de PC01 empêcherait la découverte correcte du domaine interne.','Le schéma contient le rôle DNS.'],sources:['ad','dns','itad']});break;
 case 'A02':add({mission:'Installer AD DS + DNS sur DC01 et créer la forêt ciel.lan dans le Lab isolé.',know:[k('Avant la promotion','DC01 doit avoir un nom stable, une adresse IP statique et une configuration DNS cohérente. Préparez un snapshot avant promotion si votre stratégie de Lab le prévoit.','orange'),k('Nouvelle forêt','L’installation d’une nouvelle forêt crée le premier domaine et le premier contrôleur de domaine. DNS est généralement installé avec le processus lorsque sélectionné.','blue')],steps:[st('Préparer DC01',['Nom : DC01.','IP : 192.168.10.10/24.','Pas de connexion au réseau établissement via bridge non autorisé.'],'Serveur prêt.'),st('Installer le rôle',['Gestionnaire de serveur → Ajouter des rôles et fonctionnalités → Services AD DS.','Installez aussi les outils de gestion proposés.'],'Rôle installé.'),st('Promouvoir',['Promouvoir ce serveur en contrôleur de domaine.','Ajouter une nouvelle forêt : ciel.lan.','Définissez le mot de passe DSRM de Lab selon la consigne du formateur.'],'Redémarrage et domaine créé.'),st('Vérifier DNS et AD',['Ouvrez Utilisateurs et ordinateurs AD, DNS et Services AD DS.','Testez nslookup ciel.lan et les enregistrements SRV utiles.'],'Services opérationnels.'),st('Créer le snapshot domaine-ok',['Quand tout est validé, créez un point de restauration de Lab selon la stratégie choisie.'],'État de référence.')],validate:['DC01 répond sur 192.168.10.10 et héberge ciel.lan.','Les consoles AD DS et DNS s’ouvrent et la résolution du domaine fonctionne.'],sources:['adinstall','dns','ad']});break;
 case 'A03':add({mission:'Créer une structure AD simple et pédagogique avec OU, utilisateurs et groupe de sécurité.',know:[k('OU','Une unité d’organisation sert à organiser les objets et à cibler délégation/GPO. Ce n’est pas la même chose qu’un groupe de sécurité.','blue'),k('Groupe','Un groupe de sécurité sert à attribuer des droits à un ensemble d’utilisateurs/ordinateurs. Évitez d’attribuer des droits individuellement quand un groupe convient.','green')],steps:[st('Créer les OU',['ELEVES, PROFS, POSTES.'],'Arborescence visible.'),st('Créer deux utilisateurs',['eleve01 et eleve02 avec mots de passe de Lab conformes à la consigne.','Placez-les dans ELEVES.'],'Comptes présents.'),st('Créer le groupe',['GG_ELEVES.','Ajoutez eleve01 et eleve02.'],'Membership vérifié.'),st('Expliquer OU vs groupe',['Pour chaque objet, écrivez “sert à organiser/cibler” ou “sert à attribuer des droits”.'],'Distinction claire.')],validate:['Les objets sont dans les bonnes OU.','GG_ELEVES contient les deux comptes.','Vous savez expliquer OU ≠ groupe.']});break;
 case 'A04':add({mission:'Joindre PC01 à ciel.lan en diagnostiquant d’abord DNS et connectivité.',know:[k('DNS du client','Avant la jonction, PC01 doit pouvoir résoudre les enregistrements du domaine via DC01. Une jonction réussie avec un DNS mal pensé peut produire des problèmes ultérieurs ; vérifiez donc DNS avant.','blue')],steps:[st('Configurer PC01',['IP 192.168.10.21/24.','DNS préféré 192.168.10.10.','Nom PC01.'],'Configuration connue.'),st('Tester avant jonction',['ping 192.168.10.10','nslookup ciel.lan','nslookup -type=SRV _ldap._tcp.dc._msdcs.ciel.lan si disponible.'],'DC et DNS joignables.'),st('Joindre le domaine',['Paramètres système → renommer/join domain selon version Windows.','Domaine : ciel.lan.','Utilisez un compte autorisé de Lab.'],'Message de bienvenue au domaine.'),st('Redémarrer et ouvrir une session',['Redémarrez.','Testez un compte de domaine.','Vérifiez l’objet ordinateur dans AD.'],'PC01 membre du domaine.')],validate:['PC01 apparaît dans AD et une session de domaine fonctionne.','La configuration DNS pointe vers DC01.'],sources:['dns','itad','ad']});break;
 case 'A05':add({mission:'Créer une GPO simple, la lier à une OU et prouver son application sur PC01.',know:[k('GPO','Une stratégie de groupe centralise des paramètres utilisateur/ordinateur. Son effet dépend de son contenu, du lien, du filtrage et de la position de l’objet dans AD.','blue')],steps:[st('Choisir un effet visible et réversible',['Exemple : paramètre de bureau ou restriction simple adaptée au Lab.','Évitez une règle qui pourrait vous verrouiller hors du poste.'],'Effet choisi.'),st('Créer la GPO',['Dans Gestion de stratégie de groupe, créez GPO-CIEL-DEMO.','Configurez le paramètre prévu.'],'GPO créée.'),st('Lier à l’OU cible',['Liez-la à l’OU qui contient PC01 ou l’utilisateur de test selon le type de paramètre.'],'Portée cohérente.'),st('Forcer/attendre l’application',['Sur PC01 : gpupdate /force.','Utilisez gpresult /r ou rapport HTML pour vérifier.'],'Preuve d’application.'),st('Retour arrière',['Désactivez le lien ou remettez le paramètre, puis mettez à jour les stratégies.'],'Lab réversible.')],validate:['Le paramètre est visible sur PC01.','gpresult ou équivalent montre la GPO appliquée.'],sources:['gpo','ad']});break;
 case 'A06':add({mission:'Préparer une méthode sûre de remise à zéro du Lab AD sans utiliser un snapshot comme unique stratégie de protection.',know:[k('Contrôleur de domaine virtualisé','Les DC modernes prennent en charge la virtualisation, mais la restauration d’AD reste un sujet sensible. Pour un Lab mono-DC jetable, utilisez des snapshots de manière encadrée et gardez aussi un moyen de reconstruire/restaurer proprement.','orange'),k('État de Lab','Le but pédagogique est de revenir rapidement à une situation connue, pas de reproduire une stratégie de production.','blue')],steps:[st('Définir ETAT-DOMAINE-OK',['DC01 opérationnel, DNS OK, OU/utilisateurs créés, PC01 joint si prévu.','Écrivez les tests de référence.'],'Checklist de santé.'),st('Créer l’état de retour',['Créez le snapshot/backup prévu par la plateforme à un moment cohérent.'],'Point de retour documenté.'),st('Provoquer une panne contrôlée',['Exemple : DNS de PC01 incorrect ou GPO de test erronée — pas une corruption AD arbitraire.'],'Panne observable.'),st('Restaurer le Lab',['Revenez à l’état prévu.','Rejouez ping, nslookup, ouverture de session et gpresult selon le scénario.'],'Santé vérifiée.'),st('Prévoir reconstruction',['Documentez comment recréer DC01 depuis les étapes A02–A05 si le snapshot/backup est inutilisable.'],'Plan B réel.')],validate:['Le retour à l’état sain est confirmé par des tests AD/DNS.','Un plan de reconstruction existe en plus du snapshot.'],sources:['ad','dns','hvcheck']});break;
 case 'C01':add({mission:'Classer des services en IaaS, PaaS et SaaS et identifier qui administre quoi.',know:[k('IaaS','Vous consommez des ressources d’infrastructure comme une VM ; vous gérez encore une grande partie de l’OS et des applications.','brown'),k('PaaS / SaaS','Avec PaaS, davantage de plateforme est gérée par le fournisseur. Avec SaaS, vous consommez l’application. Les responsabilités de sécurité et de données restent partagées, mais changent de périmètre.','blue')],steps:[st('Classer six exemples',['VM EC2','Base de données managée','Messagerie SaaS','Conteneur local','Serveur Proxmox','Application Web managée.'],'Classement argumenté.'),st('Construire la matrice responsabilité',['Lignes : matériel, hyperviseur, OS, runtime, application, identités, données.','Indiquez “fournisseur / établissement / partagé” selon le modèle.'],'Matrice de responsabilité.'),st('Choisir pour un Lab CIEL',['Proposez local, IaaS ou service géré pour un besoin précis et justifiez coût, contrôle et simplicité.'],'Décision pédagogique.')],validate:['Vous ne présentez pas “cloud” comme un type d’hyperviseur.','La matrice montre clairement que les responsabilités changent selon le service.'],sources:['ec2','vpc','iam']});break;
 case 'C02':add({mission:'Créer ou simuler le cycle de vie d’une instance EC2 : image, instance, connexion et terminaison.',know:[k('AMI et instance','Une AMI est un modèle d’image utilisé pour lancer une instance EC2. Une instance est un serveur virtuel en exécution dans AWS.','blue'),k('Coût','Une instance peut générer des coûts tant qu’elle est utilisée ; les règles du Free Tier/crédits évoluent. Vérifiez les conditions du compte avant toute activité réelle.','orange')],steps:[st('Lire l’architecture avant création',['AMI → type d’instance → VPC/subnet → security group → stockage EBS.'],'Schéma prévisionnel.'),st('Lancer une petite instance ou suivre en démonstration',['Choisissez l’image et la taille prévues par le formateur.','Ne créez pas de ressource hors budget/compte de formation.'],'Instance en état Running ou simulation documentée.'),st('Observer les paramètres',['Relevez ID, IP privée, subnet, security group et volume.'],'Fiche EC2.'),st('Arrêter puis terminer',['Comparez Stop et Terminate.','Terminez la ressource de Lab quand l’activité est finie selon la consigne.'],'Cycle de vie compris.')],validate:['Vous savez distinguer AMI, instance, volume et réseau.','La ressource de formation est arrêtée/terminée conformément au plan de coûts.'],sources:['ec2']});break;
 case 'C03':add({mission:'Construire un VPC simple avec sous-réseau et groupe de sécurité, puis raisonner sur la joignabilité.',know:[k('VPC','Réseau virtuel logiquement isolé dans AWS avec plage CIDR, sous-réseaux, routage et passerelles.','blue'),k('Security Group','Pare-feu virtuel stateful associé à des interfaces/instances. N’ouvrez pas 0.0.0.0/0 sans nécessité pédagogique explicite.','red')],steps:[st('Planifier l’adressage',['Choisissez un CIDR de Lab non chevauchant avec le scénario fourni.','Découpez au moins un sous-réseau.'],'Plan IP.'),st('Créer/observer le VPC',['Repérez route table, subnet et internet gateway selon le scénario.'],'Schéma AWS.'),st('Configurer un groupe de sécurité',['Autorisez seulement le port nécessaire depuis une source maîtrisée.','Évitez une ouverture mondiale si elle n’est pas requise.'],'Règle minimale.'),st('Tester la joignabilité',['Vérifiez l’accès prévu et un accès qui doit échouer.'],'Deux preuves : autorisé et bloqué.'),st('Nettoyer',['Supprimez les ressources de Lab selon l’ordre requis.'],'Environnement nettoyé.')],validate:['Le schéma relie VPC, subnet, route et security group.','Un flux autorisé et un flux bloqué sont démontrés.'],sources:['vpc','ec2']});break;

 case 'PED02':add({mission:'Construire un Lab que 15 binômes peuvent lancer, casser et remettre à zéro de la même manière.',know:[k('Reproductibilité','Même versions, mêmes noms, même plan IP, mêmes fichiers de départ et même méthode de remise à zéro. Ce sont des choix pédagogiques, pas seulement techniques.','green')],steps:[st('Figer les briques',['Versions OS/images, hyperviseur, fichiers ISO/OVA, images Docker.'],'Inventaire versionné.'),st('Nommer',['Convention : DC01, PC01, LINUX01 ; ou BINOME-XX selon le cas.'],'Convention simple.'),st('Planifier le réseau',['Sous-réseau, IP, DNS, modes réseau.','Évitez les dépendances au LAN établissement.'],'Plan IP.'),st('Préparer l’état initial',['Snapshot, template, clone, Compose ou backup selon la technologie.'],'Reset testé.'),st('Tester avec un pair',['Un collègue suit uniquement votre fiche.','Notez les ambiguïtés.'],'Fiche corrigée.')],validate:['Un pair peut démarrer le Lab sans explication orale supplémentaire.','Le reset a été testé après une panne volontaire.']});break;
 case 'PED03':add({mission:'Créer une panne contrôlée qui oblige l’élève à diagnostiquer au lieu d’appliquer une recette.',know:[k('Bonne panne pédagogique','Une seule cause principale, symptômes observables, tests possibles, retour arrière simple et aucun risque pour l’infrastructure réelle.','orange')],steps:[st('Choisir la compétence de diagnostic',['Exemple : DNS AD, port Docker, mauvais VMnet, volume absent.'],'Cause ciblée.'),st('Préparer l’état sain',['Testez et sauvegardez l’état de référence.'],'Preuve saine.'),st('Injecter une seule panne',['Modifiez un paramètre précis.','Documentez la modification pour le formateur, pas pour l’élève.'],'Panne reproductible.'),st('Écrire les indices gradués',['Indice 1 : où observer.','Indice 2 : commande de test.','Indice 3 : piste plus directe.'],'Aides prêtes.'),st('Tester le reset',['Restaurez l’état sain puis réinjectez la panne.'],'Cycle fiable.')],validate:['La panne a une cause unique et un test qui la démontre.','Le formateur peut revenir à l’état initial en quelques minutes.']});break;
 case 'PED04':add({mission:'Assembler une ressource Lab élèves complète et directement réutilisable en Bac Pro CIEL.',product:'Une fiche Lab finalisée : contexte, objectifs, architecture, matériel/fichiers, procédure élève, encarts “à savoir”, défi/panne, validation, sécurité, remise à zéro et plan B.',know:[k('Structure finale','Comprendre → préparer → manipuler → diagnostiquer → prouver → remettre à zéro. Le document doit aider l’élève au bon moment sans transformer l’activité en simple recette.','green')],steps:[st('Choisir le scénario',['Choisissez une technologie travaillée pendant la formation.','Définissez classe, durée et prérequis.'],'Cadre pédagogique.'),st('Dessiner l’architecture',['VM/CT, réseaux, IP, services, poste physique et éventuellement switch autonome.'],'Schéma exploitable.'),st('Écrire le parcours élève',['5 à 8 étapes maximum.','Insérez des encarts “À savoir” avant les notions nouvelles.','Ajoutez commandes/captures seulement lorsqu’elles soutiennent l’apprentissage.'],'Activité guidée mais active.'),st('Créer le défi',['Injectez une panne ou une décision technique.','Prévoyez des indices gradués.'],'Phase de diagnostic.'),st('Définir les preuves',['Captures, commandes, tests, schéma complété, service fonctionnel.','Chaque preuve doit correspondre à un objectif.'],'Grille de réussite.'),st('Tester remise à zéro + plan B',['Snapshot/backup/template/Compose.','Préparez alternative si Internet, VT-x ou bridge indisponible.'],'Lab robuste.'),st('Faire tester par un pair',['Le pair suit la fiche sans aide orale.','Corrigez les zones ambiguës.'],'Version 1.0 prête pour élèves.')],validate:['Le Lab peut être réalisé par un pair avec les seules ressources fournies.','Chaque objectif possède une preuve observable.','La panne et la remise à zéro ont été testées.']});break;
