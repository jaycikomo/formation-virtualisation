function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function codeify(text){const commands=[];const lines=text.split('\n');const cmdRe=/^(docker |FROM |COPY |RUN |CMD |services:|\s{2,}[a-zA-Z_-]+:|gpupdate|gpresult|ping |nslookup|ipconfig|ip addr|VBoxManage|qm |pct )/;let normal=[];for(const l of lines){if(cmdRe.test(l.trimStart()))commands.push(l);else normal.push(l)}return {normal:normal.filter(Boolean),commands}}
function renderSources(keys){return keys.map(k=>SOURCES[k]).filter(Boolean).map(s=>`<a href="${s.u}" target="_blank" rel="noreferrer">${esc(s.t)}</a>`).join('')}
function render(a){document.title=`${a.id} — ${a.title} — Lab Virtuel CIEL`;document.getElementById('crumb').textContent=`${a.track} · ${a.id}`;document.getElementById('title').textContent=a.title;document.getElementById('subtitle').textContent=a.mission;document.getElementById('meta').innerHTML=`<span class="pill">${esc(a.id)}</span><span class="pill">${esc(a.track)}</span><span class="pill">${esc(a.duration)}</span><span class="pill">Activité guidée complète</span>`;
 const know=a.know.map((x,i)=>`<article class="know ${x.type||''}"><div class="label">${i===0?'À savoir avant de commencer':'Point important'}</div><h3>${esc(x.title)}</h3><div>${esc(x.text)}</div></article>`).join('');
 const steps=a.steps.map((s,i)=>{const c=codeify(s.actions.join('\n'));const prose=c.normal.length?`<ol>${c.normal.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';const code=c.commands.length?`<pre><button class="copy" data-code="${esc(c.commands.join('\n'))}">Copier</button>${esc(c.commands.join('\n'))}</pre>`:'';const note=s.note?`<div class="inline-note ${s.noteType||''}"><b>À savoir ici</b>${esc(s.note)}</div>`:'';return `<article class="step"><div class="step-head"><div class="num">${i+1}</div><div><small>ÉTAPE ${i+1}</small><h3>${esc(s.title)}</h3></div><button class="done" data-step="${i}">Je l’ai fait</button></div><div class="step-body">${note}${prose}${code}<div class="expected"><b>Résultat attendu :</b> ${esc(s.expected)}</div></div></article>`}).join('');
 const val=a.validate.map(x=>`<li>${esc(x)}</li>`).join('');
 document.getElementById('activityView').innerHTML=`<section class="hero"><article class="panel mission"><h2>Mission</h2><p>${esc(a.mission)}</p><h3>Prérequis</h3><ul>${a.req.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="panel deliverable"><h2>Ce que vous devez produire</h2><p>${esc(a.product)}</p></article></section><h2 class="section-title">À savoir avant de commencer</h2><section class="know-grid">${know}</section><h2 class="section-title">Activité pas à pas</h2><section class="steps">${steps}</section><h2 class="section-title">Défi / diagnostic</h2><section class="know purple"><div class="label">Je relève le défi</div><h3>Ne suivez plus une recette</h3><p>${esc(a.challenge)}</p></section><h2 class="section-title">Comment savoir que j’ai réussi ?</h2><section class="validation"><ul>${val}</ul></section><h2 class="section-title">Fin de Lab</h2><section class="grid2"><article class="panel"><h3>Retour à l’état initial</h3><p>${esc(a.reset)}</p></article><article class="panel sources"><h3>Références fiables pour cette activité</h3>${renderSources([...new Set(a.sources)])}<p style="font-size:12px;color:var(--muted)">Les menus et versions peuvent évoluer : la documentation officielle reste la référence technique ; les tutoriels français servent d’accompagnement pratique.</p></article></section>`;bindProgress(a.id)}
function bindProgress(id){const buttons=[...document.querySelectorAll('.done')],key='labciel-activity-'+id;let done=JSON.parse(localStorage.getItem(key)||'[]');function update(){buttons.forEach((b,i)=>{const ok=done.includes(i);b.classList.toggle('checked',ok);b.textContent=ok?'Étape validée':'Je l’ai fait'});const pct=buttons.length?Math.round(done.length/buttons.length*100):0;document.getElementById('bar').style.width=pct+'%';document.getElementById('progressLabel').textContent=`Progression locale : ${done.length}/${buttons.length} étapes (${pct} %)`;localStorage.setItem(key,JSON.stringify(done))}buttons.forEach((b,i)=>b.onclick=()=>{done=done.includes(i)?done.filter(x=>x!==i):[...done,i];update()});document.getElementById('resetProgress').onclick=()=>{if(confirm('Réinitialiser la progression de cette activité ?')){done=[];update()}};update();document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.code);const old=b.textContent;b.textContent='Copié';setTimeout(()=>b.textContent=old,1000)})}
function showCatalog(){document.getElementById('activityView').classList.add('hidden');document.getElementById('catalogView').classList.remove('hidden');document.getElementById('title').textContent='Activités guidées complètes';document.getElementById('subtitle').textContent='Choisissez une capsule pour ouvrir son activité détaillée.';document.getElementById('meta').innerHTML=`<span class="pill">${Object.keys(C).length} activités</span>`;document.querySelector('.progress-wrap').classList.add('hidden');document.getElementById('resetProgress').classList.add('hidden');document.getElementById('catalog').innerHTML=Object.entries(C).map(([id,m])=>`<a href="?id=${id}"><small>${id} · ${esc(m[1])}</small><h3>${esc(m[0])}</h3><div>${esc(m[2])}</div></a>`).join('')}
const id=new URLSearchParams(location.search).get('id');if(id&&C[id])render(spec(id));else showCatalog();
</script>
